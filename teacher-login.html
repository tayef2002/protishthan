<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শিক্ষক লগইন — Protishthan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A56DB;--blue-dark:#1044B0;--blue-light:#EEF3FF;--blue-mid:#3B6FE0;
  --text:#0F172A;--text-2:#475569;--text-3:#94A3B8;
  --white:#fff;--border:#E2E8F0;--surface:#F8FAFF;
  --green:#059669;--green-l:#ECFDF5;--red:#DC2626;--red-l:#FEF2F2;
}
html,body{height:100%;font-family:'Inter','Hind Siliguri',sans-serif;color:var(--text);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0A1628 0%,#0F2048 45%,#1A3570 100%);position:relative}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:50px 50px}
.bg-glow{position:absolute;top:20%;left:50%;transform:translate(-50%,-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(26,86,219,.4) 0%,transparent 70%)}

.login-card{position:relative;z-index:2;background:white;border-radius:24px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.logo{text-align:center;font-size:24px;font-weight:900;color:var(--blue);letter-spacing:-.5px;margin-bottom:8px}
.logo span{color:var(--text);opacity:.6}
.subtitle{text-align:center;font-size:13px;color:var(--text-2);margin-bottom:28px}

.icon-circle{width:72px;height:72px;background:var(--blue-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px}

.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:7px}
.field-wrap{position:relative}
.field-wrap input{width:100%;padding:14px 16px;padding-left:44px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:inherit;color:var(--text);outline:none;transition:all .2s;letter-spacing:0.5px}
.field-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.field-wrap input::placeholder{color:var(--text-3);letter-spacing:normal}
.field-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px}
.field-error{font-size:12px;color:var(--red);margin-top:6px;display:none}
.field-error.show{display:block}

.btn-login{width:100%;padding:15px;background:linear-gradient(135deg,var(--blue),var(--blue-mid));color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;font-family:inherit;margin-top:8px}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(26,86,219,.4)}
.btn-login.loading .btn-text{display:none}
.btn-login .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-login.loading .spinner{display:block}

.trust-info{text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.trust-info p{font-size:11px;color:var(--text-3);line-height:1.6}

/* TOAST */
.toast-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.toast-overlay.show{opacity:1;pointer-events:all}
.toast-card{background:white;border-radius:20px;padding:32px 28px;width:100%;max-width:340px;text-align:center;transform:scale(.9) translateY(20px);transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 24px 64px rgba(0,0,0,.2);margin:0 20px}
.toast-overlay.show .toast-card{transform:scale(1) translateY(0)}
.toast-icon-wrap{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px}
.toast-icon-success{background:var(--green-l)}
.toast-icon-error{background:var(--red-l)}
.toast-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px}
.toast-msg{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:18px}
.toast-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--blue),var(--blue-mid));color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}

@media(max-width:480px){
  .login-card{margin:16px;padding:32px 24px}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="login-card">
  <div class="icon-circle">🧑‍🏫</div>
  <div class="logo">Protisht<span>han</span></div>
  <div class="subtitle">শিক্ষক — attendance, class ও salary তথ্য দেখুন</div>

  <div class="field">
    <label>ফোন নম্বর</label>
    <div class="field-wrap">
      <span class="field-icon">📱</span>
      <input type="tel" id="teacherPhone" placeholder="01XXXXXXXXX" maxlength="11" inputmode="numeric">
    </div>
    <div class="field-error" id="phoneErr">সঠিক ফোন নম্বর দিন (01XXXXXXXXX)</div>
  </div>

  <div class="field">
    <label>Teacher ID</label>
    <div class="field-wrap">
      <span class="field-icon">🆔</span>
      <input type="text" id="teacherId" placeholder="যেমন: T-0001">
    </div>
    <div class="field-error" id="idErr">আপনার Teacher ID দিন</div>
  </div>

  <button class="btn-login" id="loginBtn" onclick="doTeacherLogin()">
    <span class="btn-text">প্রবেশ করুন →</span>
    <div class="spinner"></div>
  </button>

  <div class="trust-info">
    <p>🔒 Teacher ID/ফোন নম্বর না জানলে আপনার প্রতিষ্ঠানের সাথে যোগাযোগ করুন</p>
  </div>
</div>

<div class="toast-overlay" id="toastOverlay">
  <div class="toast-card">
    <div class="toast-icon-wrap" id="toastIconWrap"><span id="toastIconEmoji">✅</span></div>
    <div class="toast-title" id="toastTitle">সফল!</div>
    <div class="toast-msg" id="toastMsg"></div>
    <button class="toast-btn" onclick="closeToast()">ঠিক আছে</button>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://eoqeeuujvpydhmfteqqj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcWVldXVqdnB5ZGhtZnRlcXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTM2NTgsImV4cCI6MjA5NzE4OTY1OH0.xuC-_euxf0DTqTpD5b8_6vgnkjeJjZIFqdKw-Bq3YbU',
  { auth: { storageKey: 'prot-teacher' } }
);

// Auto-redirect if already logged in AND is a teacher
sb.auth.getSession().then(async ({data:{session}})=>{
  if(session){
    const { data } = await sb.from('teachers').select('id').eq('user_id', session.user.id).maybeSingle();
    if(data) window.location.href = 'teacher-dashboard.html';
  }
});

function showToast(type,title,msg){
  document.getElementById('toastIconWrap').className = 'toast-icon-wrap '+(type==='success'?'toast-icon-success':'toast-icon-error');
  document.getElementById('toastIconEmoji').textContent = type==='success'?'✅':'❌';
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastOverlay').classList.add('show');
}
function closeToast(){ document.getElementById('toastOverlay').classList.remove('show'); }

async function doTeacherLogin(){
  const phone = document.getElementById('teacherPhone').value.trim();
  const teacherId = document.getElementById('teacherId').value.trim();
  const phoneErr = document.getElementById('phoneErr');
  const idErr = document.getElementById('idErr');
  phoneErr.classList.remove('show');
  idErr.classList.remove('show');

  let hasErr = false;
  if(!/^01[0-9]{9}$/.test(phone)){ phoneErr.classList.add('show'); hasErr = true; }
  if(!teacherId){ idErr.classList.add('show'); hasErr = true; }
  if(hasErr) return;

  const btn = document.getElementById('loginBtn');
  btn.classList.add('loading');

  try{
    // Step 1: find the teacher by Teacher ID
    const { data: teacherRow, error: lookupErr } = await sb
      .from('teachers')
      .select('id, email, teacher_code, phone, is_active')
      .eq('teacher_code', teacherId)
      .maybeSingle();

    if(lookupErr) throw lookupErr;
    if(!teacherRow){
      btn.classList.remove('loading');
      showToast('error','পাওয়া যায়নি','এই Teacher ID দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি।');
      return;
    }
    if(!teacherRow.is_active){
      btn.classList.remove('loading');
      showToast('error','নিষ্ক্রিয় অ্যাকাউন্ট','আপনার অ্যাকাউন্ট নিষ্ক্রিয় করা হয়েছে। প্রতিষ্ঠানের সাথে যোগাযোগ করুন।');
      return;
    }

    // Step 2: sign in using the teacher's synthetic email + entered phone number as password
    const { data, error } = await sb.auth.signInWithPassword({ email: teacherRow.email, password: phone });
    if(error){
      btn.classList.remove('loading');
      showToast('error','লগইন ব্যর্থ', error.message==='Invalid login credentials' ? 'ফোন নম্বর ও Teacher ID মিলছে না।' : error.message);
      return;
    }

    btn.classList.remove('loading');
    showToast('success','স্বাগতম! 🎉','লগইন সফল হয়েছে। Dashboard এ নিয়ে যাওয়া হচ্ছে...');
    setTimeout(()=>{ window.location.href = 'teacher-dashboard.html'; }, 1200);

  }catch(e){
    btn.classList.remove('loading');
    showToast('error','সমস্যা হয়েছে', e.message || 'আবার চেষ্টা করুন');
  }
}

// Enter key submit
document.getElementById('teacherId').addEventListener('keydown', e=>{ if(e.key==='Enter') doTeacherLogin(); });
document.getElementById('teacherPhone').addEventListener('keydown', e=>{ if(e.key==='Enter') doTeacherLogin(); });

// Only allow numbers in phone field
document.getElementById('teacherPhone').addEventListener('input', e=>{
  e.target.value = e.target.value.replace(/[^0-9]/g,'');
});
</script>
</body>
</html>
