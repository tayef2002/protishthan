<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const bn = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const en = s => String(s == null ? '' : s).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
  const track = (n, p) => { try{ if(window.track) window.track(n, p || {}); }catch(e){} };
  function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

  /* the kinds of memory: a name, a starter title, and a few first words that help someone who does not know how to begin */
  const TYPES = [
    { k: 'school', t: 'স্কুল', ph: 'যেমন: শেষ বেঞ্চের গল্প', st: ['টিফিনের ঘণ্টা পড়লেই…', 'শেষ বেঞ্চে বসে আমরা…', 'পরীক্ষার আগের রাতে…', 'স্কুলের গেটের সামনে…'], th: 'blue' },
    { k: 'friends', t: 'বন্ধু', ph: 'যেমন: আমাদের সেই আড্ডা', st: ['সেদিন আমরা সবাই মিলে…', 'ওর সাথে প্রথম দেখা…', 'আমাদের সেই গোপন জায়গা…', 'যে কথাটা আজও হাসায়…'], th: 'teal' },
    { k: 'teacher', t: 'শিক্ষক', ph: 'যেমন: প্রিয় স্যার', st: ['স্যার যেদিন বলেছিলেন…', 'ওই বকুনিটা আজও মনে পড়ে…', 'ম্যাডামের হাতের লেখা…', 'যাঁর কথায় বদলে গিয়েছিলাম…'], th: 'violet' },
    { k: 'trip', t: 'ভ্রমণ', ph: 'যেমন: সেই যাত্রা', st: ['ট্রেনের জানালা দিয়ে…', 'সেই রাতের বাসযাত্রা…', 'পৌঁছে দেখি…', 'ফেরার পথে…'], th: 'amber' },
    { k: 'family', t: 'পরিবার', ph: 'যেমন: দাদুবাড়ির উঠোন', st: ['দাদুবাড়ির উঠোনে…', 'মায়ের হাতের রান্না…', 'বাবার সাথে সেই বিকেল…', 'ছোটবেলার সেই ঘর…'], th: 'rose' },
    { k: 'eid', t: 'ঈদ ও উৎসব', ph: 'যেমন: চাঁদ রাতের আনন্দ', st: ['চাঁদ রাতে…', 'ঈদের সকালে…', 'নতুন জামার গন্ধ…', 'সেই মেলার দিন…'], th: 'amber' },
    { k: 'first', t: 'প্রথম দিন', ph: 'যেমন: প্রথম দিনের ভয়', st: ['প্রথম দিনটা…', 'কাঁপা হাতে…', 'কেউ চিনত না, তবু…', 'সেদিনই বুঝেছিলাম…'], th: 'violet' },
    { k: 'other', t: 'অন্য কিছু', ph: 'যেমন: যে স্মৃতি ভোলা যায় না', st: ['মনে পড়ে…', 'এখনও চোখ বন্ধ করলে…', 'সময় ফিরিয়ে দিলে…', 'কেউ জানে না, তবে…'], th: 'blue' }
  ];
  const THEMES = { blue: ['#1A56DB', '#7C3AED'], violet: ['#6D28D9', '#DB2777'], teal: ['#0F766E', '#1A56DB'], amber: ['#B45309', '#DB2777'], rose: ['#BE123C', '#7C3AED'] };
  const S = { type: 'school', theme: 'blue', img: null, themeTouched: false };
  const TY = () => TYPES.find(x => x.k === S.type) || TYPES[0];

  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (x, y, t) => { const p = hexRgb(x), q = hexRgb(y); return '#' + p.map((v, i) => Math.round(v + (q[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

  /* ---------- the form ---------- */
  function paintTypes(){ $('types').innerHTML = TYPES.map(t => '<button type="button" role="radio" aria-checked="' + (S.type === t.k) + '" data-k="' + t.k + '">' + t.t + '</button>').join(''); }
  function paintThemes(){ $('themes').innerHTML = Object.keys(THEMES).map(k => '<button type="button" role="radio" aria-checked="' + (S.theme === k) + '" data-k="' + k + '" style="background:' + THEMES[k][0] + '" aria-label="' + k + '"></button>').join(''); }
  function paintStarts(){ $('starts').innerHTML = '<span>কীভাবে শুরু করবেন?</span>' + TY().st.map(x => '<button type="button">' + x + '</button>').join(''); $('ttl').placeholder = TY().ph; }
  function counters(){ $('ttlN').textContent = bn($('ttl').value.length) + '/৪০'; $('txtN').textContent = bn($('txt').value.length) + '/১৬০'; }
  $('types').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.type = b.dataset.k; if(!S.themeTouched) S.theme = TY().th; paintTypes(); paintThemes(); paintStarts(); draw(); };
  $('themes').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.theme = b.dataset.k; S.themeTouched = true; paintThemes(); draw(); };
  $('starts').onclick = e => { const b = e.target.closest('button'); if(!b) return; const t = $('txt'); if(t.value.trim()) t.value = t.value.trim() + ' ' + b.textContent; else t.value = b.textContent; t.focus(); counters(); draw(); };
  ['ttl', 'txt', 'yr', 'who', 'nm'].forEach(id => $(id).addEventListener('input', () => { if(id === 'yr') $('yr').value = bn(en($('yr').value).replace(/\D/g, '').slice(0, 4)); counters(); draw(); }));

  /* a photo: read in the browser, shrunk, kept in memory only */
  $('pick').onclick = () => $('file').click();
  $('rm').onclick = () => { S.img = null; $('pickT').textContent = 'ছবি বাছুন'; $('rm').hidden = true; draw(); };
  $('file').onchange = async () => {
    const f = ($('file').files || [])[0]; $('file').value = ''; if(!f || !/^image\//.test(f.type)) return;
    try{
      let bmp; try{ bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }catch(e){ bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(f); }); }
      const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, sc = Math.min(1, 1400 / Math.max(w, h));
      const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      S.img = cv; $('pickT').textContent = 'ছবি বদলান'; $('rm').hidden = false; draw();
    }catch(e){ toast('এই ছবিটা পড়া যায়নি, অন্য ছবি দিন।'); }
  };

  /* ---------- the card: drawn here in the browser, nothing leaves the phone ---------- */
  const W = 1080, H = 1350;
  let raf = 0;
  function draw(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }
  async function render(){
    const cv = $('cv'), c = cv.getContext('2d'), th = THEMES[S.theme] || THEMES.blue;
    const HS = '"Hind Siliguri", Inter, sans-serif', DISP = '"Baloo Da 2", "Hind Siliguri", Inter, sans-serif', NAVY = '#060B1F';
    const base = mix(th[0], NAVY, .8), mid = mix(th[0], NAVY, .5), GOLD1 = '#FFE9A8', GOLD2 = '#F5B933';
    const title = $('ttl').value.trim() || TY().ph.replace(/^যেমন:\s*/, ''), body = $('txt').value.trim() || 'এখানে আপনার স্মৃতির কথা লিখুন…', yr = $('yr').value.trim(), who = $('who').value.trim(), nm = $('nm').value.trim();
    const rr = (x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
    const wrap = (txt, maxW, font, maxLines) => { c.font = font; const words = txt.split(/\s+/), out = []; let cur = ''; for(const w of words){ const t = cur ? cur + ' ' + w : w; if(c.measureText(t).width > maxW && cur){ out.push(cur); cur = w; } else cur = t; } if(cur) out.push(cur); if(out.length > maxLines){ out.length = maxLines; out[maxLines - 1] = out[maxLines - 1].replace(/\s*\S*$/, '') + '…'; } return out; };
    const shadow = (col, bl, dy) => { c.shadowColor = col || 'transparent'; c.shadowBlur = bl || 0; c.shadowOffsetY = dy || 0; };
    const glow = (x, y, r, col, a) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col + a); g.addColorStop(1, col + '00'); c.fillStyle = g; c.fillRect(0, 0, W, H); };
    try{ await Promise.all([document.fonts.load('700 40px "Hind Siliguri"'), document.fonts.load('800 40px "Baloo Da 2"'), document.fonts.load('800 40px Inter')]); }catch(e){}

    // the background: deep colour, two soft lights, fine grain
    c.fillStyle = base; c.fillRect(0, 0, W, H); glow(120, 120, 800, th[1], '8C'); glow(W - 60, H - 200, 980, th[0], 'B0');
    { const nz = document.createElement('canvas'); nz.width = nz.height = 160; const nc = nz.getContext('2d'), im = nc.createImageData(160, 160); let s = 77; for(let i = 0; i < im.data.length; i += 4){ s = (s * 1664525 + 1013904223) >>> 0; const v = (s >>> 24); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 18; } nc.putImageData(im, 0, 0); c.fillStyle = c.createPattern(nz, 'repeat'); c.fillRect(0, 0, W, H); }
    c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.9)'; c.font = '700 36px ' + HS; c.fillText('একটা স্মৃতি, একটা কার্ড', W / 2, 88);

    // the card itself, as a real memory card: black plastic, a printed colour swoosh, silver print, a cut corner, a lock switch, gold contacts; the memory is a paper label stuck on it
    const cx = 120, cy = 128, cw = 840, ch = 1060, cut = 118, R = 44, up = c => c;
    const path = () => { c.beginPath(); c.moveTo(cx + R, cy); c.lineTo(cx + cw - cut, cy); c.lineTo(cx + cw, cy + cut); c.lineTo(cx + cw, cy + ch - R); c.arcTo(cx + cw, cy + ch, cx + cw - R, cy + ch, R); c.lineTo(cx + R, cy + ch); c.arcTo(cx, cy + ch, cx, cy + ch - R, R); c.lineTo(cx, cy + R); c.arcTo(cx, cy, cx + R, cy, R); c.closePath(); };
    // a soft shadow on the table
    c.save(); c.translate(W / 2, cy + ch / 2); c.rotate(-.01); c.translate(-W / 2, -(cy + ch / 2));
    shadow('rgba(0,0,0,.62)', 70, 34); path(); c.fillStyle = '#15171E'; c.fill(); shadow();
    c.save(); path(); c.clip();
    // the plastic: a charcoal gradient with a faint grain
    const pb = c.createLinearGradient(cx, cy, cx + cw * .6, cy + ch); pb.addColorStop(0, '#3A3F4D'); pb.addColorStop(.45, '#1F222B'); pb.addColorStop(1, '#101218'); c.fillStyle = pb; c.fillRect(cx, cy, cw, ch);
    { const gr = document.createElement('canvas'); gr.width = gr.height = 120; const gc = gr.getContext('2d'), gi = gc.createImageData(120, 120); let q = 41; for(let i = 0; i < gi.data.length; i += 4){ q = (q * 1664525 + 1013904223) >>> 0; const v = q >>> 24; gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = v; gi.data[i + 3] = 14; } gc.putImageData(gi, 0, 0); c.fillStyle = c.createPattern(gr, 'repeat'); c.fillRect(cx, cy, cw, ch); }
    // the printed colour swoosh across the top (in the colour the person picked)
    const sw = c.createLinearGradient(cx, cy, cx + cw, cy + 340); sw.addColorStop(0, mix(th[0], '#000000', .15)); sw.addColorStop(.6, th[0]); sw.addColorStop(1, th[1]);
    c.fillStyle = sw; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + cw, cy); c.lineTo(cx + cw, cy + 190); c.bezierCurveTo(cx + cw * .72, cy + 300, cx + cw * .3, cy + 120, cx, cy + 250); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.09)'; c.beginPath(); c.moveTo(cx, cy + 250); c.bezierCurveTo(cx + cw * .3, cy + 120, cx + cw * .72, cy + 300, cx + cw, cy + 190); c.lineTo(cx + cw, cy + 206); c.bezierCurveTo(cx + cw * .72, cy + 318, cx + cw * .3, cy + 138, cx, cy + 268); c.closePath(); c.fill();
    // the print: brand, big silver name, speed class and a "capacity" (the year, or infinity when there is none)
    c.textAlign = 'left'; c.fillStyle = '#fff'; c.beginPath(); c.arc(cx + 78, cy + 78, 26, 0, 7); c.fillStyle = 'rgba(255,255,255,.95)'; c.fill(); c.fillStyle = th[0]; c.font = '800 30px Inter, sans-serif'; c.textAlign = 'center'; c.fillText('P', cx + 78, cy + 89);
    c.textAlign = 'left'; c.fillStyle = '#fff'; c.font = '800 36px Inter, sans-serif'; c.fillText('Protishthan', cx + 118, cy + 90);
    const sg = c.createLinearGradient(cx, cy + 130, cx, cy + 215); sg.addColorStop(0, '#FFFFFF'); sg.addColorStop(.55, '#D7DCE6'); sg.addColorStop(1, '#9AA3B5'); c.fillStyle = sg; c.font = '900 76px Inter, sans-serif'; shadow('rgba(0,0,0,.45)', 8, 4); c.fillText('MEMORY', cx + 52, cy + 200); shadow();
    c.font = '700 30px ' + HS; c.fillStyle = 'rgba(255,255,255,.9)'; c.fillText('মেমোরি কার্ড · ' + TY().t, cx + 56, cy + 252);
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 4; c.beginPath(); c.arc(cx + 450, cy + 247, 25, -2.6, 2.6); c.stroke(); c.fillStyle = 'rgba(255,255,255,.95)'; c.font = '800 28px Inter, sans-serif'; c.textAlign = 'center'; c.fillText('10', cx + 458, cy + 257); c.textAlign = 'left';
    const cap = yr || '∞'; c.textAlign = 'right'; c.fillStyle = GOLD1; c.font = '900 ' + (yr ? 74 : 92) + 'px Inter, sans-serif'; shadow('rgba(0,0,0,.4)', 8, 4); c.fillText(cap, cx + cw - 54, cy + 262 + (yr ? 0 : 6)); shadow(); c.textAlign = 'left';

    // the paper label with the memory on it
    const lx = cx + 44, ly = cy + 330, lw = cw - 88, lh = ch - 330 - 214, pad = 44, tw = lw - pad * 2;
    c.save(); c.translate(lx + lw / 2, ly + lh / 2); c.rotate(-.011); c.translate(-(lx + lw / 2), -(ly + lh / 2));
    shadow('rgba(0,0,0,.45)', 22, 10); rr(lx, ly, lw, lh, 18); c.fillStyle = '#FFFCF3'; c.fill(); shadow();
    c.save(); rr(lx, ly, lw, lh, 18); c.clip();
    c.fillStyle = mix(th[0], '#FFFFFF', .93); c.fillRect(lx, ly, lw, 14);
    c.strokeStyle = mix(th[0], '#FFFFFF', .82); c.lineWidth = 2; for(let yy = ly + 70; yy < ly + lh; yy += 48){ c.beginPath(); c.moveTo(lx, yy); c.lineTo(lx + lw, yy); c.stroke(); }
    c.strokeStyle = 'rgba(220,60,70,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(lx + 22, ly); c.lineTo(lx + 22, ly + lh); c.stroke();
    // the words, measured first and centred in the label
    const avail = lh - 78, hasImg = !!S.img, lpad = pad + 6, ltw = tw - 10;
    const tl = wrap(title, ltw, '800 54px ' + DISP, 2), foot = who;
    let maxL = hasImg ? 3 : 6, bl = wrap(body, ltw, '500 33px ' + HS, maxL);
    const LHT = 62, LHB = 48, textOf = b => tl.length * LHT + 12 + b.length * LHB + (foot ? 52 : 0) + (nm ? 48 : 0);
    while(textOf(bl) > avail - (hasImg ? 150 + 26 : 0) && maxL > 2){ maxL--; bl = wrap(body, ltw, '500 33px ' + HS, maxL); }
    const textH = textOf(bl), ph = hasImg ? Math.max(150, Math.min(300, avail - textH - 26)) : 0, total = (hasImg ? ph + 26 : 0) + textH;
    let y = ly + Math.max(22, (lh - total) / 2);
    if(hasImg){ const ix = lx + lpad, iw = ltw, im = S.img, sc = Math.max(iw / im.width, ph / im.height), dw = im.width * sc, dh = im.height * sc; c.save(); rr(ix, y, iw, ph, 16); c.clip(); c.drawImage(im, ix + (iw - dw) / 2, y + (ph - dh) / 2, dw, dh); c.restore(); c.lineWidth = 5; c.strokeStyle = '#fff'; rr(ix, y, iw, ph, 16); c.stroke(); y += ph + 26; }
    c.textAlign = 'left'; c.fillStyle = mix(th[0], NAVY, .5); c.font = '800 54px ' + DISP; y += 44; tl.forEach(l => { c.fillText(l, lx + lpad, y); y += LHT; }); y -= 14;
    c.fillStyle = '#2B3445'; c.font = '500 33px ' + HS; y += 26; bl.forEach(l => { c.fillText(l, lx + lpad, y); y += LHB; });
    if(foot){ c.fillStyle = th[0]; c.font = '700 29px ' + HS; c.fillText(foot, lx + lpad, y + 14); y += 52; }
    if(nm){ c.fillStyle = '#64748B'; c.font = '600 28px ' + HS; c.fillText('— ' + nm, lx + lpad, y + 10); }
    c.restore();
    // a piece of tape holding the label
    c.save(); c.translate(lx + lw - 96, ly - 6); c.rotate(.12); c.fillStyle = 'rgba(255,238,170,.78)'; c.fillRect(-52, -20, 104, 40); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-52, -20, 104, 8); c.restore();
    c.restore();

    // the lock switch on the left edge
    c.fillStyle = '#0B0C10'; rr(cx - 4, cy + 520, 26, 96, 8); c.fill(); const lk = c.createLinearGradient(cx, 0, cx + 20, 0); lk.addColorStop(0, '#E7EAF0'); lk.addColorStop(1, '#9CA4B4'); rr(cx + 1, cy + 530, 15, 44, 5); c.fillStyle = lk; c.fill();
    // the contacts: a recessed dark strip with nine gold pads, each with a little shine
    const sy = cy + ch - 196, sh2 = 160; rr(cx + 62, sy, cw - 124, sh2, 18); c.fillStyle = '#08090D'; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.1)'; c.stroke();
    const n = 9, gap = 11, pw = (cw - 124 - 36 - gap * (n - 1)) / n, px0 = cx + 62 + 18;
    for(let i = 0; i < n; i++){ const px = px0 + i * (pw + gap), pt = i === 0 || i === 4 || i === 8 ? sy + 14 : sy + 14, ph2 = i % 2 ? sh2 - 38 : sh2 - 28; const g = c.createLinearGradient(px, 0, px + pw, 0); g.addColorStop(0, '#B8860B'); g.addColorStop(.3, '#FFE9A8'); g.addColorStop(.6, '#F5B933'); g.addColorStop(1, '#A87408'); rr(px, pt, pw, ph2, 7); c.fillStyle = g; c.fill(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(px + 5, pt + 6, 4, ph2 - 14); }
    // light on the plastic: a diagonal sheen and the bevelled edge
    const sh = c.createLinearGradient(cx, cy, cx + cw * .9, cy + ch * .5); sh.addColorStop(0, 'rgba(255,255,255,.22)'); sh.addColorStop(.3, 'rgba(255,255,255,.05)'); sh.addColorStop(.31, 'rgba(255,255,255,0)'); c.fillStyle = sh; c.fillRect(cx, cy, cw, ch);
    c.restore();
    path(); const eg = c.createLinearGradient(cx, cy, cx + cw, cy + ch); eg.addColorStop(0, 'rgba(255,255,255,.55)'); eg.addColorStop(.5, 'rgba(255,255,255,.08)'); eg.addColorStop(1, 'rgba(255,255,255,.25)'); c.lineWidth = 4; c.strokeStyle = eg; c.stroke();
    c.restore();
    // the foot of the picture
    c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.92)'; c.font = '700 34px ' + HS; c.fillText('আপনার স্মৃতিটাও কার্ডে রাখুন', W / 2, H - 100);
    c.fillStyle = 'rgba(255,255,255,.6)'; c.font = '800 28px Inter, sans-serif'; c.fillText('PROTISHTHAN.COM/MEMORY', W / 2, H - 52);
  }

  /* ---------- download, share, caption ---------- */
  const capText = () => { const t = $('ttl').value.trim() || TY().t + 'র স্মৃতি', b = $('txt').value.trim(); return t + (b ? '\n' + b : '') + '\n\nআপনার একটা স্মৃতি নিয়ে মেমোরি কার্ড বানান 👇\nprotishthan.com/memory'; };
  const fileOf = () => new Promise(res => $('cv').toBlob(b => res(b ? new File([b], 'memory-card.png', { type: 'image/png' }) : null), 'image/png'));
  function count(){ let n = 0; try{ n = +localStorage.getItem('mem_n') || 0; }catch(e){} return n; }
  function bump(){ let n = count() + 1; try{ localStorage.setItem('mem_n', String(n)); }catch(e){} showCount(); }
  function showCount(){ const n = count(); const p = $('cnt'); if(n){ p.textContent = 'আপনি এ পর্যন্ত ' + bn(n) + 'টা মেমোরি কার্ড বানিয়েছেন।'; p.hidden = false; } }
  $('dl').onclick = async () => { await render(); const f = await fileOf(); if(!f){ toast('কার্ড বানানো যায়নি, আবার চেষ্টা করুন।'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = 'memory-card.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); bump(); track('memory_download', { type: S.type, photo: S.img ? 1 : 0 }); toast('কার্ড ডাউনলোড হয়েছে। এবার বন্ধুদের সাথে ভাগ করুন।'); };
  $('sh').onclick = async () => { await render(); const f = await fileOf(); if(!f) return; try{ await navigator.share({ files: [f], text: capText() }); bump(); track('memory_share', { type: S.type }); }catch(e){} };
  $('cpCap').onclick = async () => { try{ await navigator.clipboard.writeText(capText()); }catch(e){ const t = document.createElement('textarea'); t.value = capText(); document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(_){} t.remove(); } toast('ক্যাপশন কপি হয়েছে।'); track('memory_caption', {}); };
  $('again').onclick = () => { ['ttl', 'txt', 'yr', 'who'].forEach(id => { $(id).value = ''; }); S.img = null; $('pickT').textContent = 'ছবি বাছুন'; $('rm').hidden = true; counters(); draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); $('ttl').focus({ preventScroll: true }); };

  /* start */
  paintTypes(); paintThemes(); paintStarts(); counters(); showCount();
  try{ const f = new File([''], 'x.png', { type: 'image/png' }); if(navigator.canShare && navigator.canShare({ files: [f] })) $('sh').hidden = false; }catch(e){}
  try{ if(window.Protishthan && Protishthan.member) Protishthan.member.ready().then(() => { const me = Protishthan.member.current && Protishthan.member.current(); if(me && me.display_name && !$('nm').value) $('nm').value = String(me.display_name).slice(0, 24); draw(); }).catch(() => {}); }catch(e){}
  draw();
  track('memory_view', {});
})();
