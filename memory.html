(function(){
  'use strict';

    { k: 'then', n: 'তখন আর এখন', ph: 2, pos: true, two: true },

  const S = { tpl: 'card', theme: 'blue', size: 'post', pos: 'bottom', photos: [null, null] };
  const TP = () => TPLS.find(t => t.k === S.tpl) || TPLS[0];
  const DRAFT = 'mem_draft_v2';

  /* ---------- small helpers for drawing ---------- */
  let c = null;
  const HS = '"Hind Siliguri", Inter, sans-serif', DISP = '"Baloo Da 2", "Hind Siliguri", Inter, sans-serif', NAVY = '#060B1F', GOLD1 = '#FFE9A8', GOLD2 = '#F5B933';
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (x, y, t) => { const p = hexRgb(x), q = hexRgb(y); return '#' + p.map((v, i) => Math.round(v + (q[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const rr = (x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  const shadow = (col, bl, dy) => { c.shadowColor = col || 'transparent'; c.shadowBlur = bl || 0; c.shadowOffsetY = dy || 0; };
  const glow = (W, H, x, y, r, col, a) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col + a); g.addColorStop(1, col + '00'); c.fillStyle = g; c.fillRect(0, 0, W, H); };
  const wrap = (txt, maxW, font, maxLines) => { c.font = font; const words = String(txt).split(/\s+/).filter(Boolean), out = []; let cur = ''; for(const w of words){ const t = cur ? cur + ' ' + w : w; if(c.measureText(t).width > maxW && cur){ out.push(cur); cur = w; } else cur = t; } if(cur) out.push(cur); if(out.length > maxLines){ out.length = maxLines; out[maxLines - 1] = out[maxLines - 1].replace(/\s*\S*$/, '') + '…'; } return out; };
  /* the biggest size (from max down to min) at which the text fits in maxLines lines */
  function fit(txt, maxW, maxLines, max, min, weight, fam){ let sz = max, lines; do{ lines = wrap(txt, maxW, weight + ' ' + sz + 'px ' + fam, maxLines + 1); sz -= 2; }while((lines.length > maxLines || lines.some(l => c.measureText(l).width > maxW)) && sz >= min); sz += 2; lines = wrap(txt, maxW, weight + ' ' + sz + 'px ' + fam, maxLines); return { size: sz, lines }; }
  function deepBg(W, H, th){ const base = mix(th[0], NAVY, .8); c.fillStyle = base; c.fillRect(0, 0, W, H); glow(W, H, 120, 120, W * .75, th[1], '8C'); glow(W, H, W - 60, H - 200, W * .9, th[0], 'B0'); grain(W, H, 18); }
  let GR = null;
  function grain(W, H, a){ if(!GR){ GR = document.createElement('canvas'); GR.width = GR.height = 160; const nc = GR.getContext('2d'), im = nc.createImageData(160, 160); let s = 77; for(let i = 0; i < im.data.length; i += 4){ s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } nc.putImageData(im, 0, 0); } c.save(); c.globalAlpha = a / 255; c.fillStyle = c.createPattern(GR, 'repeat'); c.fillRect(0, 0, W, H); c.restore(); }
  /* a photo cropped to fill a rounded box; with no photo, a soft box that says "add a photo" */
  function photo(img, x, y, w, h, r, th){
    if(img){ const sc = Math.max(w / img.width, h / img.height), dw = img.width * sc, dh = img.height * sc; c.save(); rr(x, y, w, h, r); c.clip(); c.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); c.restore(); return; }
    c.save(); rr(x, y, w, h, r); c.fillStyle = mix(th[0], '#FFFFFF', .86); c.fill(); c.setLineDash([14, 12]); c.lineWidth = 4; c.strokeStyle = mix(th[0], '#FFFFFF', .55); c.stroke(); c.setLineDash([]);
    const m = Math.min(w, h); c.fillStyle = mix(th[0], '#FFFFFF', .45); c.beginPath(); c.arc(x + w / 2, y + h / 2 - m * .06, m * .075, 0, 7); c.fill();
    c.textAlign = 'center'; c.font = '700 ' + Math.max(24, Math.round(m * .06)) + 'px ' + HS; c.fillText('ছবি দিন', x + w / 2, y + h / 2 + m * .17); c.restore();
  }
  function mark(W, H, dark){ c.save(); c.textAlign = 'center'; c.fillStyle = dark ? 'rgba(15,23,42,.45)' : 'rgba(255,255,255,.6)'; c.font = '800 24px Inter, sans-serif'; c.fillText('PROTISHTHAN.COM/MEMORY', W / 2, H - 36); c.restore(); }
  /* the text block shared by several templates: a small line in a pill, the title, the line */
  function textBlock(x, y, w, d, o){
    o = o || {}; const col = o.col || '#fff', sub = o.sub || 'rgba(255,255,255,.88)';
    const t = fit(d.title || 'আমাদের সেই দিন', w, 2, o.tmax || 92, 48, '800', DISP), l = d.line ? fit(d.line, w, o.lmax || 4, 40, 28, '500', HS) : null;
    const total = (d.small ? 66 : 0) + t.lines.length * (t.size * 1.12) + t.size * .1 + 12 + (l ? l.size * 1.1 + l.lines.length * (l.size * 1.45) : 0);
    if(o.measure) return total;
    let cy = y; c.textAlign = 'left';
    if(d.small){ c.font = '700 28px ' + HS; const sw = c.measureText(d.small).width + 40; rr(x, cy, sw, 48, 24); c.fillStyle = 'rgba(255,255,255,.16)'; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.4)'; c.stroke(); c.fillStyle = col; c.fillText(d.small, x + 20, cy + 34); cy += 66; }
    c.fillStyle = col; c.font = '800 ' + t.size + 'px ' + DISP; shadow(o.shadow ? 'rgba(0,0,0,.45)' : '', 16, 5); cy += t.size * .9; t.lines.forEach(s => { c.fillText(s, x, cy); cy += t.size * 1.12; }); shadow(); cy += 12 - t.size * .8;
    if(l){ c.fillStyle = sub; c.font = '500 ' + l.size + 'px ' + HS; cy += l.size * 1.1; l.lines.forEach(s => { c.fillText(s, x, cy); cy += l.size * 1.45; }); }
    return total;
  }

  /* ---------- the templates ---------- */
  const T = {};
  // 1) the memory card, as a real one: black plastic, a printed swoosh, gold contacts, the memory on a paper label
  T.card = (W, H, d, th) => {
    deepBg(W, H, th); const oy = (H - 1350) / 2; c.save(); c.translate(0, oy);
    const cx = 120, cy = 128, cw = 840, ch = 1060, cut = 118, R = 44;
    const path = () => { c.beginPath(); c.moveTo(cx + R, cy); c.lineTo(cx + cw - cut, cy); c.lineTo(cx + cw, cy + cut); c.lineTo(cx + cw, cy + ch - R); c.arcTo(cx + cw, cy + ch, cx + cw - R, cy + ch, R); c.lineTo(cx + R, cy + ch); c.arcTo(cx, cy + ch, cx, cy + ch - R, R); c.lineTo(cx, cy + R); c.arcTo(cx, cy, cx + R, cy, R); c.closePath(); };
    c.save(); c.translate(W / 2, cy + ch / 2); c.rotate(-.01); c.translate(-W / 2, -(cy + ch / 2));
    shadow('rgba(0,0,0,.62)', 70, 34); path(); c.fillStyle = '#15171E'; c.fill(); shadow();
    c.save(); path(); c.clip();
    const pb = c.createLinearGradient(cx, cy, cx + cw * .6, cy + ch); pb.addColorStop(0, '#3A3F4D'); pb.addColorStop(.45, '#1F222B'); pb.addColorStop(1, '#101218'); c.fillStyle = pb; c.fillRect(cx, cy, cw, ch);
    c.save(); c.translate(cx, cy); grain(cw, ch, 14); c.restore();
    const sw = c.createLinearGradient(cx, cy, cx + cw, cy + 340); sw.addColorStop(0, mix(th[0], '#000000', .15)); sw.addColorStop(.6, th[0]); sw.addColorStop(1, th[1]);
    c.fillStyle = sw; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + cw, cy); c.lineTo(cx + cw, cy + 190); c.bezierCurveTo(cx + cw * .72, cy + 300, cx + cw * .3, cy + 120, cx, cy + 250); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.09)'; c.beginPath(); c.moveTo(cx, cy + 250); c.bezierCurveTo(cx + cw * .3, cy + 120, cx + cw * .72, cy + 300, cx + cw, cy + 190); c.lineTo(cx + cw, cy + 206); c.bezierCurveTo(cx + cw * .72, cy + 318, cx + cw * .3, cy + 138, cx, cy + 268); c.closePath(); c.fill();
    c.textAlign = 'center'; c.beginPath(); c.arc(cx + 78, cy + 78, 26, 0, 7); c.fillStyle = 'rgba(255,255,255,.95)'; c.fill(); c.fillStyle = th[0]; c.font = '800 30px Inter, sans-serif'; c.fillText('P', cx + 78, cy + 89);
    c.textAlign = 'left'; c.fillStyle = '#fff'; c.font = '800 36px Inter, sans-serif'; c.fillText('Protishthan', cx + 118, cy + 90);
    const sg = c.createLinearGradient(cx, cy + 130, cx, cy + 215); sg.addColorStop(0, '#FFFFFF'); sg.addColorStop(.55, '#D7DCE6'); sg.addColorStop(1, '#9AA3B5'); c.fillStyle = sg; c.font = '900 76px Inter, sans-serif'; shadow('rgba(0,0,0,.45)', 8, 4); c.fillText('MEMORY', cx + 52, cy + 200); shadow();
    c.font = '700 30px ' + HS; c.fillStyle = 'rgba(255,255,255,.9)'; c.fillText('মেমোরি কার্ড', cx + 56, cy + 252);
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 4; c.beginPath(); c.arc(cx + 450, cy + 247, 25, -2.6, 2.6); c.stroke(); c.fillStyle = 'rgba(255,255,255,.95)'; c.font = '800 28px Inter, sans-serif'; c.textAlign = 'center'; c.fillText('10', cx + 458, cy + 257); c.textAlign = 'left';
    const yr = (en(d.small || '').match(/\d{4}/) || [''])[0], cap = yr ? bn(yr) : '∞'; c.textAlign = 'right'; c.fillStyle = GOLD1; c.font = '900 ' + (yr ? 74 : 92) + 'px Inter, sans-serif'; shadow('rgba(0,0,0,.4)', 8, 4); c.fillText(cap, cx + cw - 54, cy + 262 + (yr ? 0 : 6)); shadow(); c.textAlign = 'left';
    // the paper label
    const lx = cx + 44, ly = cy + 330, lw = cw - 88, lh = ch - 330 - 214, pad = 44, tw = lw - pad * 2;
    c.save(); c.translate(lx + lw / 2, ly + lh / 2); c.rotate(-.011); c.translate(-(lx + lw / 2), -(ly + lh / 2));
    shadow('rgba(0,0,0,.45)', 22, 10); rr(lx, ly, lw, lh, 18); c.fillStyle = '#FFFCF3'; c.fill(); shadow();
    c.save(); rr(lx, ly, lw, lh, 18); c.clip();
    c.fillStyle = mix(th[0], '#FFFFFF', .93); c.fillRect(lx, ly, lw, 14);
    c.strokeStyle = mix(th[0], '#FFFFFF', .82); c.lineWidth = 2; for(let yy = ly + 70; yy < ly + lh; yy += 48){ c.beginPath(); c.moveTo(lx, yy); c.lineTo(lx + lw, yy); c.stroke(); }
    c.strokeStyle = 'rgba(220,60,70,.35)'; c.beginPath(); c.moveTo(lx + 22, ly); c.lineTo(lx + 22, ly + lh); c.stroke();
    const avail = lh - 78, hasImg = !!d.photos[0], lpad = pad + 6, ltw = tw - 10, title = d.title || 'আমাদের সেই দিন', body = d.line || '', foot = d.small || '';
    const tl = wrap(title, ltw, '800 54px ' + DISP, 2);
    let maxL = hasImg ? 3 : 6, bl = body ? wrap(body, ltw, '500 33px ' + HS, maxL) : [];
    const LHT = 62, LHB = 48, textOf = b => tl.length * LHT + 12 + b.length * LHB + (foot ? 52 : 0);
    while(textOf(bl) > avail - (hasImg ? 150 + 26 : 0) && maxL > 2){ maxL--; bl = wrap(body, ltw, '500 33px ' + HS, maxL); }
    const textH = textOf(bl), ph = hasImg ? Math.max(150, Math.min(300, avail - textH - 26)) : 0, total = (hasImg ? ph + 26 : 0) + textH;
    let y = ly + Math.max(22, (lh - total) / 2);
    if(hasImg){ const ix = lx + lpad, iw = ltw, im = d.photos[0], sc = Math.max(iw / im.width, ph / im.height), dw = im.width * sc, dh = im.height * sc; c.save(); rr(ix, y, iw, ph, 16); c.clip(); c.drawImage(im, ix + (iw - dw) / 2, y + (ph - dh) / 2, dw, dh); c.restore(); c.lineWidth = 5; c.strokeStyle = '#fff'; rr(ix, y, iw, ph, 16); c.stroke(); y += ph + 26; }
    c.textAlign = 'left'; c.fillStyle = mix(th[0], NAVY, .5); c.font = '800 54px ' + DISP; y += 44; tl.forEach(l => { c.fillText(l, lx + lpad, y); y += LHT; }); y -= 14;
    c.fillStyle = '#2B3445'; c.font = '500 33px ' + HS; y += 26; bl.forEach(l => { c.fillText(l, lx + lpad, y); y += LHB; });
    if(foot){ c.fillStyle = th[0]; c.font = '700 29px ' + HS; c.fillText(foot, lx + lpad, y + 14); }
    c.restore();
    c.save(); c.translate(lx + lw - 96, ly - 6); c.rotate(.12); c.fillStyle = 'rgba(255,238,170,.78)'; c.fillRect(-52, -20, 104, 40); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-52, -20, 104, 8); c.restore();
    c.restore();
    c.fillStyle = '#0B0C10'; rr(cx - 4, cy + 520, 26, 96, 8); c.fill(); const lk = c.createLinearGradient(cx, 0, cx + 20, 0); lk.addColorStop(0, '#E7EAF0'); lk.addColorStop(1, '#9CA4B4'); rr(cx + 1, cy + 530, 15, 44, 5); c.fillStyle = lk; c.fill();
    const sy = cy + ch - 196, sh2 = 160; rr(cx + 62, sy, cw - 124, sh2, 18); c.fillStyle = '#08090D'; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.1)'; c.stroke();
    const n = 9, gap = 11, pw = (cw - 124 - 36 - gap * (n - 1)) / n, px0 = cx + 62 + 18;
    for(let i = 0; i < n; i++){ const px = px0 + i * (pw + gap), ph2 = i % 2 ? sh2 - 38 : sh2 - 28; const g = c.createLinearGradient(px, 0, px + pw, 0); g.addColorStop(0, '#B8860B'); g.addColorStop(.3, GOLD1); g.addColorStop(.6, GOLD2); g.addColorStop(1, '#A87408'); rr(px, sy + 14, pw, ph2, 7); c.fillStyle = g; c.fill(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(px + 5, sy + 20, 4, ph2 - 14); }
    const sh = c.createLinearGradient(cx, cy, cx + cw * .9, cy + ch * .5); sh.addColorStop(0, 'rgba(255,255,255,.22)'); sh.addColorStop(.3, 'rgba(255,255,255,.05)'); sh.addColorStop(.31, 'rgba(255,255,255,0)'); c.fillStyle = sh; c.fillRect(cx, cy, cw, ch);
    c.restore();
    path(); const eg = c.createLinearGradient(cx, cy, cx + cw, cy + ch); eg.addColorStop(0, 'rgba(255,255,255,.55)'); eg.addColorStop(.5, 'rgba(255,255,255,.08)'); eg.addColorStop(1, 'rgba(255,255,255,.25)'); c.lineWidth = 4; c.strokeStyle = eg; c.stroke();
    c.restore(); c.restore(); mark(W, H);
  };

  // 2) a polaroid on a soft background, with a caption under the photo
  T.polaroid = (W, H, d, th) => {
    deepBg(W, H, th); const pw = W * .8, side = pw - 80, capH = 330, ph = 60 + side + capH, px = (W - pw) / 2, py = (H - ph) / 2 - 10;
    c.save(); c.translate(W / 2, py + ph / 2); c.rotate(-.035); c.translate(-W / 2, -(py + ph / 2));
    shadow('rgba(0,0,0,.55)', 50, 24); rr(px, py, pw, ph, 14); c.fillStyle = '#FBFAF6'; c.fill(); shadow();
    photo(d.photos[0], px + 40, py + 40, side, side, 6, th);
    const tx = px + 56, tw = pw - 112; c.textAlign = 'left';
    const t = fit(d.title || 'আমাদের সেই দিন', tw, 2, 64, 40, '800', DISP), l = d.line ? fit(d.line, tw, 2, 32, 24, '500', HS) : null;
    let y = py + 40 + side + 36 + t.size * .85; c.fillStyle = mix(th[0], NAVY, .55); c.font = '800 ' + t.size + 'px ' + DISP; t.lines.forEach(s => { c.fillText(s, tx, y); y += t.size * 1.08; });
    if(l){ c.fillStyle = '#4B5563'; c.font = '500 ' + l.size + 'px ' + HS; y += 4; l.lines.forEach(s => { c.fillText(s, tx, y + l.size * .6); y += l.size * 1.4; }); }
    if(d.small){ c.fillStyle = th[0]; c.font = '700 28px ' + HS; c.textAlign = 'right'; c.fillText(d.small, px + pw - 56, py + ph - 30); }
    c.save(); c.translate(W / 2, py - 4); c.rotate(.05); c.fillStyle = 'rgba(255,238,170,.8)'; c.fillRect(-90, -24, 180, 48); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-90, -24, 180, 10); c.restore();
    c.restore(); mark(W, H);
  };

  // 3) the whole picture, the words over it at the top, the middle or the bottom
  T.full = (W, H, d, th) => {
    if(d.photos[0]) photo(d.photos[0], 0, 0, W, H, 0, th); else { const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, th[0]); g.addColorStop(1, th[1]); c.fillStyle = g; c.fillRect(0, 0, W, H); }
    const m = 84, w = W - m * 2, hgt = textBlock(0, 0, w, d, { measure: true });
    let y, g;
    if(S.pos === 'top'){ g = c.createLinearGradient(0, 0, 0, hgt + 340); g.addColorStop(0, 'rgba(6,11,31,.85)'); g.addColorStop(1, 'rgba(6,11,31,0)'); c.fillStyle = g; c.fillRect(0, 0, W, hgt + 340); y = 120; }
    else if(S.pos === 'mid'){ c.fillStyle = 'rgba(6,11,31,.5)'; c.fillRect(0, 0, W, H); y = (H - hgt) / 2; }
    else { g = c.createLinearGradient(0, H - hgt - 380, 0, H); g.addColorStop(0, 'rgba(6,11,31,0)'); g.addColorStop(1, 'rgba(6,11,31,.9)'); c.fillStyle = g; c.fillRect(0, H - hgt - 380, W, hgt + 380); y = H - hgt - 96; }
    textBlock(m, y, w, d, { shadow: true }); mark(W, H);
  };

  // 4) two photos side by side, the words above or below
  T.duo = (W, H, d, th) => {
    deepBg(W, H, th); const m = 64, w = W - m * 2, o = { tmax: 80, lmax: 3, shadow: true }, hgt = textBlock(0, 0, w, d, { measure: true, tmax: 80, lmax: 3 }), gap = 24, top = S.pos === 'top';
    const phH = H - hgt - 64 - 96 - 70, pw = (w - gap) / 2, py = top ? 96 + hgt + 64 : 96;
    photo(d.photos[0], m, py, pw, phH, 28, th); photo(d.photos[1], m + pw + gap, py, pw, phH, 28, th);
    textBlock(m, top ? 96 : py + phH + 56, w, d, o); mark(W, H);
  };

  // 5) then and now: two photos one above the other with their labels
  T.then = (W, H, d, th) => {
    deepBg(W, H, th); const m = 64, w = W - m * 2, o = { tmax: 76, lmax: 2, shadow: true }, hgt = textBlock(0, 0, w, d, { measure: true, tmax: 76, lmax: 2 }), gap = 36, top = S.pos === 'top';
    const total = H - hgt - 70 - 96 - 48 - gap, ph = total / 2, y0 = top ? 96 + hgt + 48 : 96;
    const lab = (txt, x, y) => { c.font = '800 36px ' + HS; const lw = c.measureText(txt).width + 48; rr(x, y, lw, 64, 32); c.fillStyle = GOLD2; c.fill(); c.fillStyle = '#3B2A00'; c.textAlign = 'left'; c.fillText(txt, x + 24, y + 44); };
    photo(d.photos[0], m, y0, w, ph, 30, th); photo(d.photos[1], m, y0 + ph + gap, w, ph, 30, th); lab('তখন', m + 28, y0 + 28); lab('এখন', m + 28, y0 + ph + gap + 28);
    const by = y0 + ph + gap / 2, bx = W - m - 70; c.beginPath(); c.arc(bx, by, 46, 0, 7); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = th[0]; c.lineWidth = 7; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(bx, by - 18); c.lineTo(bx, by + 18); c.moveTo(bx - 16, by + 3); c.lineTo(bx, by + 19); c.lineTo(bx + 16, by + 3); c.stroke();
    textBlock(m, top ? 96 : y0 + ph * 2 + gap + 48, w, d, o); mark(W, H);
  };

  // 6) a film strip with two frames, a warm tint, the caption below
  T.film = (W, H, d, th) => {
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2B1B12'); g.addColorStop(1, '#0E0A07'); c.fillStyle = g; c.fillRect(0, 0, W, H); glow(W, H, W * .8, 160, W * .8, '#F59E0B', '33'); grain(W, H, 20);
    const sx = 150, sw = W - 300, sy = 70, capH = textBlock(0, 0, sw, d, { measure: true, tmax: 64, lmax: 2 }) + 40 + 110, sh = H - capH - 70;
    c.save(); shadow('rgba(0,0,0,.6)', 40, 16); rr(sx, sy, sw, sh, 18); c.fillStyle = '#0A0A0C'; c.fill(); shadow();
    const hole = (x, y) => { rr(x, y, 26, 38, 6); c.fillStyle = '#F3E9D2'; c.fill(); };
    for(let y = sy + 26; y < sy + sh - 40; y += 66){ hole(sx + 22, y); hole(sx + sw - 48, y); }
    const fx = sx + 84, fw = sw - 168, gap = 26, fh = (sh - 52 - gap) / 2;
    [0, 1].forEach(i => { const fy = sy + 26 + i * (fh + gap); photo(d.photos[i], fx, fy, fw, fh, 8, th); c.save(); rr(fx, fy, fw, fh, 8); c.clip(); c.fillStyle = 'rgba(255,170,80,.13)'; c.fillRect(fx, fy, fw, fh); const vg = c.createRadialGradient(fx + fw / 2, fy + fh / 2, fh * .3, fx + fw / 2, fy + fh / 2, fw * .65); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)'); c.fillStyle = vg; c.fillRect(fx, fy, fw, fh); c.restore(); c.fillStyle = '#F3E9D2'; c.font = '700 22px Inter, sans-serif'; c.textAlign = 'left'; c.fillText(String(i + 1) + 'A', fx, fy + fh + 20); });
    c.restore();
    textBlock(sx, sy + sh + 40, sw, d, { col: '#FFF3DC', sub: 'rgba(255,243,220,.85)', tmax: 64, lmax: 2, shadow: true }); mark(W, H);
  };

  // 7) a few words, with a round photo if there is one
  T.quote = (W, H, d, th) => {
    deepBg(W, H, th); const m = 90, w = W - m * 2, has = !!d.photos[0]; let y = has ? 170 : 0;
    if(has){ const r = 190; c.save(); c.beginPath(); c.arc(W / 2, y + r, r, 0, 7); c.clip(); const im = d.photos[0], sc = Math.max(r * 2 / im.width, r * 2 / im.height); c.drawImage(im, W / 2 - im.width * sc / 2, y + r - im.height * sc / 2, im.width * sc, im.height * sc); c.restore(); c.lineWidth = 10; c.strokeStyle = '#fff'; c.beginPath(); c.arc(W / 2, y + r, r, 0, 7); c.stroke(); y += r * 2 + 50; }
    const q = fit(d.line || d.title || 'আপনার একটা কথা এখানে লিখুন', w, has ? 5 : 8, has ? 62 : 76, 36, '700', DISP), lh = q.size * 1.38;
    const blockH = 110 + q.lines.length * lh + (d.line && d.title ? 90 : 0) + (d.small ? 60 : 0);
    if(!has) y = (H - blockH) / 2;
    c.textAlign = 'center'; c.fillStyle = GOLD1; c.font = '900 200px ' + DISP; c.fillText('“', W / 2, y + 120); y += 120;
    c.fillStyle = '#fff'; c.font = '700 ' + q.size + 'px ' + DISP; shadow('rgba(0,0,0,.35)', 14, 4); q.lines.forEach(s => { c.fillText(s, W / 2, y + q.size); y += lh; }); shadow();
    if(d.line && d.title){ y += 30; c.fillStyle = GOLD1; c.font = '800 40px ' + HS; c.fillText('— ' + d.title, W / 2, y + 40); y += 60; }
    if(d.small){ c.fillStyle = 'rgba(255,255,255,.75)'; c.font = '600 32px ' + HS; c.fillText(d.small, W / 2, y + 40); }
    mark(W, H);
  };

  /* ---------- drawing the picture and the small pictures of the templates ---------- */
  const data = () => ({ title: $('ttl').value.trim(), line: $('txt').value.trim(), small: $('sm').value.trim(), photos: S.photos });
  function paint(cv, W, H, d, tplKey, k){ const prev = c; c = cv.getContext('2d'); c.setTransform(k, 0, 0, k, 0, 0); c.clearRect(0, 0, W, H); c.save(); c.textBaseline = 'alphabetic'; try{ T[tplKey](W, H, d, THEMES[S.theme] || THEMES.blue); }catch(e){ console.error(e); } c.restore(); c = prev; }
  let raf = 0;
  function draw(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }
  async function render(){
    const sz = SIZES[S.size], cv = $('cv'); if(cv.width !== sz.w || cv.height !== sz.h){ cv.width = sz.w; cv.height = sz.h; }
    try{ await Promise.all([document.fonts.load('700 40px "Hind Siliguri"'), document.fonts.load('800 40px "Baloo Da 2"'), document.fonts.load('800 40px Inter')]); }catch(e){}
    paint(cv, sz.w, sz.h, data(), S.tpl, 1); saveDraft();
  }
  /* the small pictures in the template row: sample words and two sample photos, in the current colour and size */
  const SAMPLE = []; function samples(){ if(SAMPLE.length) return SAMPLE; [['#F59E0B', '#DB2777'], ['#22D3EE', '#4F46E5']].forEach(cc => { const s = document.createElement('canvas'); s.width = 800; s.height = 800; const x = s.getContext('2d'); const g = x.createLinearGradient(0, 0, 800, 800); g.addColorStop(0, cc[0]); g.addColorStop(1, cc[1]); x.fillStyle = g; x.fillRect(0, 0, 800, 800); x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.arc(400, 330, 130, 0, 7); x.fill(); x.fillRect(240, 480, 320, 320); SAMPLE.push(s); }); return SAMPLE; }
  async function thumbs(){
    try{ await Promise.all([document.fonts.load('700 40px "Hind Siliguri"'), document.fonts.load('800 40px "Baloo Da 2"')]); }catch(e){}
    const sz = SIZES[S.size], k = 150 / sz.w, sm = samples(), d = { title: 'আমাদের সেই দিন', line: 'ছোট একটা লাইন এখানে', small: '২০১৮', photos: sm };
    TPLS.forEach(t => { const cv = document.querySelector('#tpls canvas[data-k="' + t.k + '"]'); if(!cv) return; cv.width = Math.round(sz.w * k); cv.height = Math.round(sz.h * k); paint(cv, sz.w, sz.h, d, t.k, k); });
  }

  /* ---------- the form ---------- */
  function paintTpls(){ $('tpls').innerHTML = TPLS.map(t => '<button type="button" role="radio" aria-checked="' + (S.tpl === t.k) + '" data-k="' + t.k + '"><canvas data-k="' + t.k + '"></canvas><span>' + t.n + (t.ph === 2 ? '<i>২ ছবি</i>' : '') + '</span></button>').join(''); }
  function paintThemes(){ $('themes').innerHTML = Object.keys(THEMES).map(k => '<button type="button" role="radio" aria-checked="' + (S.theme === k) + '" data-k="' + k + '" style="background:' + THEMES[k][0] + '" aria-label="' + k + '"></button>').join(''); }
  function paintSize(){ $('size').innerHTML = Object.keys(SIZES).map(k => '<button type="button" role="radio" aria-checked="' + (S.size === k) + '" data-k="' + k + '">' + SIZES[k].n + '</button>').join(''); }
  function paintPos(){ const t = TP(), list = t.two ? POS.filter(p => p[0] !== 'mid') : POS; if(t.two && S.pos === 'mid') S.pos = 'bottom'; $('posWrap').hidden = !t.pos; $('pos').innerHTML = list.map(p => '<button type="button" role="radio" aria-checked="' + (S.pos === p[0]) + '" data-k="' + p[0] + '">' + p[1] + '</button>').join(''); }
  function paintSlots(){
    const t = TP(), n = t.ph; $('phHint').textContent = n === 2 ? '(দুটো ছবি লাগবে)' : t.opt ? '(ঐচ্ছিক)' : '';
    $('slots').innerHTML = Array.from({ length: n }, (_, i) => { const im = S.photos[i]; return '<div class="mc-slot' + (im ? ' has' : '') + '" data-i="' + i + '">' + (im ? '<img alt="" data-i="' + i + '"><button type="button" class="x" data-x="' + i + '" aria-label="ছবি সরান">×</button>' : '<button type="button" class="add" data-add="' + i + '"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><b>' + (n === 2 ? (t.k === 'then' ? (i ? 'এখনকার ছবি' : 'তখনকার ছবি') : 'ছবি ' + bn(i + 1)) : 'ছবি দিন') + '</b></button>') + '</div>'; }).join('');
    S.photos.forEach((im, i) => { const el = $('slots').querySelector('img[data-i="' + i + '"]'); if(el && im){ const s = document.createElement('canvas'); s.width = 160; s.height = 160; const x = s.getContext('2d'), sc = Math.max(160 / im.width, 160 / im.height); x.drawImage(im, 80 - im.width * sc / 2, 80 - im.height * sc / 2, im.width * sc, im.height * sc); el.src = s.toDataURL('image/jpeg', .7); } });
  }
  function counters(){ $('ttlN').textContent = bn($('ttl').value.length) + '/৪০'; }
  $('tpls').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.tpl = b.dataset.k; paintTpls(); thumbs(); paintSlots(); paintPos(); draw(); track('memory_tpl', { t: S.tpl }); };
  $('themes').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.theme = b.dataset.k; paintThemes(); thumbs(); draw(); };
  $('size').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.size = b.dataset.k; paintSize(); thumbs(); draw(); };
  $('pos').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.pos = b.dataset.k; paintPos(); draw(); };
  ['ttl', 'txt', 'sm'].forEach(id => $(id).addEventListener('input', () => { counters(); draw(); }));

  /* photos: read in the browser, shrunk, kept in memory only; several picked at once fill the empty slots in order */
  let target = 0;
  $('slots').onclick = e => { const x = e.target.closest('button[data-x]'); if(x){ S.photos[+x.dataset.x] = null; paintSlots(); draw(); return; } const a = e.target.closest('button[data-add]'); if(a){ target = +a.dataset.add; $('file').click(); return; } const has = e.target.closest('.mc-slot.has'); if(has){ target = +has.dataset.i; $('file').click(); } };
  $('file').onchange = async () => {
    const files = Array.from($('file').files || []).filter(f => /^image\//.test(f.type)); $('file').value = ''; if(!files.length) return;
    let slot = target, put = 0;
    for(const f of files){
      if(slot >= TP().ph) break;
      try{
        let bmp; try{ bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }catch(e){ bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(f); }); }
        const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, sc = Math.min(1, 1600 / Math.max(w, h)), cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        S.photos[slot] = cv; slot++; put++;
      }catch(e){ toast('একটা ছবি পড়া যায়নি।'); }
    }
    if(put){ paintSlots(); draw(); }
  };

  /* what was written last time is kept in this browser (not the photos), so the next card starts faster */
  function saveDraft(){ try{ localStorage.setItem(DRAFT, JSON.stringify({ tpl: S.tpl, theme: S.theme, size: S.size, pos: S.pos, ttl: $('ttl').value, txt: $('txt').value, sm: $('sm').value })); }catch(e){} }
  function loadDraft(){ try{ const d = JSON.parse(localStorage.getItem(DRAFT) || 'null'); if(!d) return; if(TPLS.some(t => t.k === d.tpl)) S.tpl = d.tpl; if(THEMES[d.theme]) S.theme = d.theme; if(SIZES[d.size]) S.size = d.size; if(['top', 'mid', 'bottom'].includes(d.pos)) S.pos = d.pos; $('ttl').value = String(d.ttl || '').slice(0, 40); $('txt').value = String(d.txt || '').slice(0, 160); $('sm').value = String(d.sm || '').slice(0, 40); }catch(e){} }

  /* ---------- download, share, caption ---------- */
  const capText = () => { const t = $('ttl').value.trim(), l = $('txt').value.trim(); return (t || 'একটা স্মৃতি') + (l ? '\n' + l : '') + '\n\nনিজের স্মৃতির কার্ড বানান 👇\nprotishthan.com/memory'; };
  const fileOf = () => new Promise(res => $('cv').toBlob(b => res(b ? new File([b], 'memory-card.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', .93));
  function count(){ let n = 0; try{ n = +localStorage.getItem('mem_n') || 0; }catch(e){} return n; }
  function bump(){ const n = count() + 1; try{ localStorage.setItem('mem_n', String(n)); }catch(e){} showCount(); }
  function showCount(){ const n = count(), p = $('cnt'); if(n){ p.textContent = 'আপনি এ পর্যন্ত ' + bn(n) + 'টা কার্ড বানিয়েছেন।'; p.hidden = false; } }
  $('dl').onclick = async () => { await render(); const f = await fileOf(); if(!f){ toast('কার্ড বানানো যায়নি, আবার চেষ্টা করুন।'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = 'memory-card.jpg'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); bump(); track('memory_download', { t: S.tpl, size: S.size, photos: S.photos.filter(Boolean).length }); toast('কার্ড ডাউনলোড হয়েছে।'); };
  $('sh').onclick = async () => { await render(); const f = await fileOf(); if(!f) return; try{ await navigator.share({ files: [f], text: capText() }); bump(); track('memory_share', { t: S.tpl }); }catch(e){} };
  $('cpCap').onclick = async () => { try{ await navigator.clipboard.writeText(capText()); }catch(e){ const t = document.createElement('textarea'); t.value = capText(); document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(_){} t.remove(); } toast('ক্যাপশন কপি হয়েছে।'); track('memory_caption', {}); };
  $('again').onclick = () => { ['ttl', 'txt', 'sm'].forEach(id => { $(id).value = ''; }); S.photos = [null, null]; counters(); paintSlots(); draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  /* start */
  loadDraft(); paintTpls(); paintThemes(); paintSize(); paintPos(); paintSlots(); counters(); showCount();
  try{ const f = new File([''], 'x.png', { type: 'image/png' }); if(navigator.canShare && navigator.canShare({ files: [f] })) $('sh').hidden = false; }catch(e){}
  draw(); thumbs();
  track('memory_view', {});
})();
