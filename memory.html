<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const bn = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const track = (n, p) => { try{ if(window.track) window.track(n, p || {}); }catch(e){} };
  function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

  /* the colours: soft, light and friendly. bg is the paper, bg2 a deeper tint of it, ac the accent, dk the ink. */
  const THEMES = {
    sepia: { n: 'পুরনো ছবি', bg: '#F8EEDD', bg2: '#EED8B4', ac: '#B06A2C', dk: '#4A2C12' },
    mint: { n: 'পুদিনা', bg: '#EAF7F0', bg2: '#CDEEDC', ac: '#2E9E74', dk: '#14433A' },
    sky: { n: 'আকাশি', bg: '#EAF3FD', bg2: '#CFE3FA', ac: '#2F7DE1', dk: '#16365E' },
    peach: { n: 'পীচ', bg: '#FFF0E6', bg2: '#FFDAC4', ac: '#E8743B', dk: '#5A2A12' },
    lavender: { n: 'ল্যাভেন্ডার', bg: '#F2EDFD', bg2: '#DDD2F9', ac: '#7C5CE0', dk: '#2F2260' },
    lemon: { n: 'লেবু', bg: '#FFF8DC', bg2: '#FBEAA0', ac: '#D4A60E', dk: '#4F3F06' },
    rose: { n: 'গোলাপি', bg: '#FFEEF2', bg2: '#FFD2DD', ac: '#E04870', dk: '#5C1630' }
  };
  const SIZES = { post: { w: 1080, h: 1350, n: 'পোস্ট (৪:৫)' }, story: { w: 1080, h: 1920, n: 'স্টোরি (৯:১৬)' } };
  /* the shapes: an object we all remember, with a window for the photo. a = width / height of the object, ph = how many photos. */
  const TPLS = [
    { k: 'mem1', n: 'মেমোরি কার্ড', a: .79, ph: 1, card: 1 },
    { k: 'mem2', n: 'দুটো মেমোরি কার্ড', a: 1.22, ph: 2, card: 1 },
    { k: 'tfile', n: 'লেখা স্মৃতি', a: .79, ph: 0, card: 1, own: 1 },
    { k: 'board', n: 'ব্ল্যাকবোর্ড', a: 1.12, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'autograph', n: 'অটোগ্রাফ খাতা', a: .8, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'postcard', n: 'পুরনো চিঠি', a: 1.42, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'sms', n: 'পুরনো ফোনের মেসেজ', a: .5, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'tvhs', n: 'ভিএইচএস টেপ', a: .79, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'tdream', n: 'স্বপ্নের আলো', a: .79, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'tstamp', n: 'পুরনো ছবির ক্যাপশন', a: .79, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'text', n: 'নোটবুকের পাতা', a: .79, ph: 0, card: 1, own: 1, off: 1 },
    { k: 'old1', n: 'পুরনো ছবি', a: .84, ph: 1, card: 1, off: 1 },
    { k: 'old2', n: 'দুটো স্মৃতি', a: 1.22, ph: 2, card: 1, off: 1 },
    { k: 'card1', n: 'ছবির কার্ড', a: .82, ph: 1, card: 1, off: 1 },
    { k: 'card3', n: 'পোস্টকার্ড', a: 1.28, ph: 1, card: 1, off: 1 },
    { k: 'card2', n: 'দুই ছবি', a: 1.2, ph: 2, card: 1, off: 1 }
  ];
  const S = { tpl: 'mem1', theme: 'mint', size: 'post', photos: [null, null] };
  const TP = () => TPLS.find(t => t.k === S.tpl) || TPLS[0];
  const DRAFT = 'mem_draft_v5';

  /* ---------- small helpers for drawing ---------- */
  let c = null, PAL = THEMES.mint;
  const HS = '"Hind Siliguri", Inter, sans-serif', DISP = '"Baloo Da 2", "Hind Siliguri", Inter, sans-serif';
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (x, y, t) => { const p = hexRgb(x), q = hexRgb(y); return '#' + p.map((v, i) => Math.round(v + (q[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const rr = (x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  const shadow = (col, bl, dy) => { c.shadowColor = col || 'transparent'; c.shadowBlur = bl || 0; c.shadowOffsetY = dy || 0; };
  const wrap = (txt, maxW, font, maxLines) => { c.font = font; const words = String(txt).split(/\s+/).filter(Boolean), out = []; let cur = ''; for(const w of words){ const t = cur ? cur + ' ' + w : w; if(c.measureText(t).width > maxW && cur){ out.push(cur); cur = w; } else cur = t; } if(cur) out.push(cur); if(out.length > maxLines){ out.length = maxLines; out[maxLines - 1] = out[maxLines - 1].replace(/\s*\S*$/, '') + '…'; } return out; };
  function fit(txt, maxW, maxLines, max, min, weight, fam){ let sz = max, lines; do{ lines = wrap(txt, maxW, weight + ' ' + sz + 'px ' + fam, maxLines + 1); sz -= 2; }while((lines.length > maxLines || lines.some(l => c.measureText(l).width > maxW)) && sz >= min); sz += 2; lines = wrap(txt, maxW, weight + ' ' + sz + 'px ' + fam, maxLines); return { size: sz, lines }; }
  /* a photo cropped to fill the current clip; with no photo, a soft box that says "add a photo" */
  function fill(img, x, y, w, h){
    if(img){ const sc = Math.max(w / img.width, h / img.height), dw = img.width * sc, dh = img.height * sc; c.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); return; }
    c.fillStyle = mix(PAL.ac, '#FFFFFF', .82); c.fillRect(x, y, w, h); const m = Math.min(w, h);
    c.fillStyle = mix(PAL.ac, '#FFFFFF', .55); c.beginPath(); c.arc(x + w / 2, y + h / 2 - m * .06, m * .1, 0, 7); c.fill(); rr(x + w / 2 - m * .2, y + h / 2 + m * .06, m * .4, m * .16, m * .06); c.fill();
    c.textAlign = 'center'; c.fillStyle = mix(PAL.ac, '#FFFFFF', .2); c.font = '700 ' + Math.max(22, Math.round(m * .07)) + 'px ' + HS; c.fillText('ছবি দিন', x + w / 2, y + h / 2 + m * .34);
  }
  /* put a photo into a shape: pathFn draws the shape's outline, the box says how big the photo should be */
  function put(i, pathFn, x, y, w, h){ c.save(); pathFn(); c.clip(); fill(S.cur.photos[i], x, y, w, h); c.restore(); }
  /* ---------- the cards. A photo card lies on the paper like the card on the map pages of Unseen: a pale tint of the paper, a thin edge in the main colour, the photo inside it with soft corners, a short label under the photo, tilted a little. ---------- */
  const SH = {};
  const rgba = (hex, a) => { const q = hexRgb(hex); return 'rgba(' + q[0] + ',' + q[1] + ',' + q[2] + ',' + a + ')'; };
  /* one card: centre cx, cy, size w x h, tilt ang, the photo slot i, an optional label */
  function card(cx, cy, w, h, ang, i, label){
    c.save(); c.translate(cx, cy); c.rotate(ang); c.translate(-w / 2, -h / 2);
    const m = w * .055, chin = label ? Math.max(h * .13, 64) : m * 1.9, r = w * .05;
    shadow(rgba(PAL.ac, .085), 44, 10); rr(0, 0, w, h, r); c.fillStyle = mix(PAL.bg, '#FFFFFF', .88); c.fill(); shadow();
    rr(0, 0, w, h, r); c.lineWidth = 4; c.strokeStyle = mix(PAL.bg2, '#FFFFFF', .35); c.stroke();
    const px = m, py = m, pw = w - m * 2, ph = h - m - chin;
    put(i, () => rr(px, py, pw, ph, r * .6), px, py, pw, ph);
    if(label){ const f = fit(label, w - m * 2, 1, Math.round(chin * .42), 20, '800', HS); c.textAlign = 'center'; c.fillStyle = PAL.dk; c.font = '800 ' + f.size + 'px ' + HS; c.fillText(f.lines[0], w / 2, h - chin / 2 + f.size * .34); }
    c.restore();
  }
  /* ---------- an old print: a real photograph from an old album. The photo is faded to a warm brown, grainy, darker at the corners, with a few scratches and specks; it sits in a cream border with a torn edge, a fold, a piece of tape or a paper clip, and a line of handwriting under it. ---------- */
  const rng = seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const AGED = {};
  /* the photo, aged: drawn into a small canvas, then every pixel is turned to a faded sepia with grain and a vignette */
  function aged(i, w, h){
    const im = S.cur.photos[i], key = i + '|' + Math.round(w) + '|' + Math.round(h) + '|' + (im ? '' : PAL.ac), hit = AGED[key];
    if(hit && hit.src === im) return hit.cv;
    const k = Math.min(1, 820 / Math.max(w, h)), W = Math.max(8, Math.round(w * k)), H = Math.max(8, Math.round(h * k));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const prev = c; c = cv.getContext('2d'); fill(im, 0, 0, W, H);
    const id = c.getImageData(0, 0, W, H), d = id.data, r = rng(7 + i * 31);
    for(let y = 0; y < H; y++){
      const dy = (y / H - .5) * 2;
      for(let x = 0; x < W; x++){
        const p = (y * W + x) * 4, dx = (x / W - .5) * 2, r2 = (dx * dx + dy * dy) / 2;
        let l = (d[p] * .299 + d[p + 1] * .587 + d[p + 2] * .114) / 255;
        l = Math.max(0, Math.min(1, l + (l - .5) * .22)); l = (.08 + Math.pow(l, .92) * .84) * (1 - .34 * r2 * r2 - .08 * r2);
        const n = (r() - .5) * 30;
        d[p] = Math.max(0, Math.min(255, (44 + 206 * l) * .9 + d[p] * .1 + n));
        d[p + 1] = Math.max(0, Math.min(255, (31 + 196 * l) * .9 + d[p + 1] * .1 + n));
        d[p + 2] = Math.max(0, Math.min(255, (20 + 168 * l) * .9 + d[p + 2] * .1 + n));
      }
    }
    c.putImageData(id, 0, 0);
    /* scratches and dust */
    c.lineCap = 'round';
    for(let j = 0; j < 7; j++){ const x0 = r() * W, y0 = r() * H, a = (r() - .5) * .5 + Math.PI / 2, len = H * (.12 + r() * .3); c.strokeStyle = 'rgba(255,248,232,' + (.12 + r() * .16) + ')'; c.lineWidth = .8 + r() * 1.2; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + Math.cos(a) * len, y0 + Math.sin(a) * len); c.stroke(); }
    for(let j = 0; j < 70; j++){ c.fillStyle = r() > .45 ? 'rgba(255,250,238,' + (.25 + r() * .4) + ')' : 'rgba(40,26,14,' + (.2 + r() * .35) + ')'; c.beginPath(); c.arc(r() * W, r() * H, .6 + r() * 1.9, 0, 7); c.fill(); }
    c = prev; AGED[key] = { src: im, cv }; return cv;
  }
  /* the outline of an old print: straight, but the edge wavers a little, like a deckle cut */
  function deckle(w, h, amp, seed){
    const r = rng(seed), pts = [], st = 11;
    const edge = (x0, y0, x1, y1) => { const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / st)); for(let q = 0; q < n; q++){ const t = q / n; pts.push([x0 + (x1 - x0) * t + (r() - .5) * amp, y0 + (y1 - y0) * t + (r() - .5) * amp]); } };
    edge(0, 0, w, 0); edge(w, 0, w, h); edge(w, h, 0, h); edge(0, h, 0, 0);
    c.beginPath(); const m0 = [(pts[pts.length - 1][0] + pts[0][0]) / 2, (pts[pts.length - 1][1] + pts[0][1]) / 2]; c.moveTo(m0[0], m0[1]);
    for(let q = 0; q < pts.length; q++){ const a = pts[q], b = pts[(q + 1) % pts.length]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    c.closePath();
  }
  function paperclip(x, y, ang){
    c.save(); c.translate(x, y); c.rotate(ang); c.lineCap = 'round'; c.lineJoin = 'round';
    const loop = () => { c.beginPath(); c.moveTo(14, 70); c.lineTo(14, 16); c.arc(2, 16, 12, 0, Math.PI, true); c.lineTo(-10, 78); c.arc(6, 78, 16, Math.PI, 0, true); c.lineTo(22, 28); c.arc(14, 28, 8, 0, Math.PI, true); c.lineTo(6, 58); };
    c.strokeStyle = 'rgba(60,50,40,.22)'; c.lineWidth = 9; c.save(); c.translate(3, 4); loop(); c.stroke(); c.restore();
    c.strokeStyle = '#A9B1B8'; c.lineWidth = 7; loop(); c.stroke(); c.strokeStyle = '#E4E8EB'; c.lineWidth = 2.5; loop(); c.stroke(); c.restore();
  }
  function tapeOn(x, y, ang, w){ c.save(); c.translate(x, y); c.rotate(ang); c.fillStyle = 'rgba(226,204,150,.74)'; c.beginPath(); const hh = w * .24; c.moveTo(-w / 2, -hh / 2); for(let q = 0; q <= 6; q++) c.lineTo(-w / 2 + (q % 2 ? -3 : 3), -hh / 2 + hh * q / 6); c.lineTo(w / 2, hh / 2); for(let q = 6; q >= 0; q--) c.lineTo(w / 2 + (q % 2 ? 3 : -3), -hh / 2 + hh * q / 6); c.closePath(); c.fill(); c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(-w / 2 + 4, -hh / 2 + 3, w - 8, hh * .22); c.restore(); }
  /* one print: centre cx, cy, size w x h, tilt ang, photo slot i, handwriting label, seed for the edge, fold = a crease across it */
  function print(cx, cy, w, h, ang, i, label, seed, fold){
    c.save(); c.translate(cx, cy); c.rotate(ang); c.translate(-w / 2, -h / 2);
    deckle(w, h, 5, seed); shadow('rgba(70,48,22,.2)', 44, 12); c.fillStyle = '#F7F0DF'; c.fill(); shadow();
    c.save(); deckle(w, h, 5, seed); c.clip();
    c.fillStyle = radial(w / 2, h / 2, Math.max(w, h) * .72, [[.5, 'rgba(201,166,107,0)'], [1, 'rgba(190,150,90,.34)']]); c.fillRect(0, 0, w, h);
    const m = w * .075, chin = label ? Math.max(h * .15, 70) : m * 1.7, px = m, py = m, pw = w - m * 2, ph = h - m - chin;

  const screenOf = kind => (x, y, w, h) => { const ch = h * .94; memcard(x + w / 2, y + h / 2, ch * 840 / 1060, -.02, 0, '', Object.assign(kind === 'file' ? cdataF() : cdata(), { kind })); };
  SH.tfile = screenOf('file'); SH.tvhs = screenOf('vhs'); SH.tdream = screenOf('dream'); SH.tstamp = screenOf('stamp');

  SH.mem1 = (x, y, w, h) => { const ch = h * .94; memcard(x + w / 2, y + h / 2, ch * 840 / 1060, -.025, 0, S.cur.small); };
  SH.mem2 = (x, y, w, h) => { const ch = h * .86, cw = ch * 840 / 1060; memcard(x + w * .29, y + h * .47, cw, -.09, 0, ''); memcard(x + w * .71, y + h * .53, cw, .06, 1, S.cur.small); };

  SH.card1 = (x, y, w, h) => { const k = .9; card(x + w / 2, y + h / 2, w * k, h * k, -.07, 0, S.cur.small); };
  SH.card3 = (x, y, w, h) => {
    const k = .92, cw = w * k, ch = h * k;
    card(x + w / 2, y + h / 2, cw, ch, .035, 0, S.cur.small);
    c.save(); c.translate(x + w / 2, y + h / 2 - ch / 2 + 4); c.rotate(.035 - .05); c.fillStyle = rgba(PAL.ac, .22); c.fillRect(-w * .09, -w * .026, w * .18, w * .052); c.restore();
  };
  SH.card2 = (x, y, w, h) => {
    const ch = h * .8, cw = ch * .8;
    card(x + w * .31, y + h * .47, cw, ch, -.1, 0, '');
    card(x + w * .69, y + h * .55, cw, ch, .08, 1, S.cur.small);
  };

  /* ---------- the whole card: a soft paper, the object with the photo, a few words below ---------- */
    const radial = (x, y, r, stops) => { const g = c.createRadialGradient(x, y, 0, x, y, r); stops.forEach(p => g.addColorStop(p[0], p[1])); return g; };
  /* a very light paper of the chosen colour, with a hint of the main colour at the edges, nothing else: flat to the eye */
  function paper(W, H, cx, cy){
    const base = mix(PAL.bg, '#FFFFFF', .62); c.fillStyle = base; c.fillRect(0, 0, W, H);
    c.fillStyle = radial(cx, cy, Math.max(W, H) * .85, [[0, rgba(base, 0)], [1, rgba(PAL.ac, .075)]]); c.fillRect(0, 0, W, H);
  }
  function render1(W, H, d, key){
    PAL = THEMES[S.theme] || THEMES.mint; S.cur = d; c.textBaseline = 'alphabetic';
    const t = TPLS.find(x => x.k === key) || TPLS[0], mw = W - 160;
    const title = d.title || 'আমাদের সেই দিন', own = !!t.own, tt = own ? { lines: [], size: 0 } : fit(title, mw, 2, 78, 44, '800', DISP), ll = !own && d.line ? fit(d.line, mw, 3, 36, 26, '500', HS) : null;
    const capH = tt.lines.length * tt.size * 1.15 + (ll ? 22 + ll.lines.length * ll.size * 1.5 : 0) + (d.small && !t.card ? 84 : 0);
    const GAP = own ? 0 : 56, top = H * .06, bottom = H - 110, regionH = bottom - top - capH - GAP;
    const oh = Math.min(regionH, (W * .8) / t.a), ow = oh * t.a, group = oh + GAP + capH, g0 = top + Math.max(0, (bottom - top - group) / 2) - H * .01;
    const ox = (W - ow) / 2, oy = g0;
    paper(W, H, W / 2, oy + oh / 2);
    c.save(); SH[key](ox, oy, ow, oh); c.restore();
    let y = oy + oh + GAP; c.textAlign = 'center';
    c.fillStyle = PAL.dk; c.font = '800 ' + tt.size + 'px ' + DISP; y += tt.size * .85; tt.lines.forEach(s => { c.fillText(s, W / 2, y); y += tt.size * 1.15; }); y -= tt.size * .2;
    if(ll){ c.fillStyle = mix(PAL.dk, '#FFFFFF', .25); c.font = '500 ' + ll.size + 'px ' + HS; y += 22; ll.lines.forEach(s => { y += ll.size * 1.5; c.fillText(s, W / 2, y - ll.size * .45); }); }
    if(d.small && !t.card){ c.font = '700 30px ' + HS; const sw = c.measureText(d.small).width + 48; y += 26; rr(W / 2 - sw / 2, y, sw, 54, 27); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2; c.strokeStyle = mix(PAL.ac, '#FFFFFF', .5); c.stroke(); c.fillStyle = PAL.ac; c.fillText(d.small, W / 2, y + 37); }
    c.fillStyle = mix(PAL.dk, '#FFFFFF', .55); c.font = '800 22px Inter, sans-serif'; c.fillText('PROTISHTHAN.COM/MEMORY', W / 2, H - 46);
  }

  /* ---------- drawing the picture and the small pictures of the shapes ---------- */
  const data = () => ({ title: $('ttl').value.trim(), line: $('txt').value.trim(), small: $('sm').value.trim(), photos: S.photos });
  function paint(cv, W, H, d, key, k){ const prev = c; c = cv.getContext('2d'); c.setTransform(k, 0, 0, k, 0, 0); c.clearRect(0, 0, W, H); c.save(); try{ render1(W, H, d, key); }catch(e){ console.error(e); } c.restore(); c = prev; }
  let raf = 0;
  function draw(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }
  async function render(){
    const sz = SIZES[S.size], cv = $('cv'); if(cv.width !== sz.w || cv.height !== sz.h){ cv.width = sz.w; cv.height = sz.h; } $('pvc').style.setProperty('--ar', (sz.w / sz.h).toFixed(4));
    try{ await Promise.all([document.fonts.load('700 40px "Hind Siliguri"'), document.fonts.load('800 40px "Baloo Da 2"'), document.fonts.load('800 40px Inter')]); }catch(e){}
    paint(cv, sz.w, sz.h, data(), S.tpl, 1); saveDraft();
  }
  const SAMPLE = []; function samples(){ if(SAMPLE.length) return SAMPLE; [['#F59E0B', '#EF6C8B'], ['#34B6E8', '#6D6FE8']].forEach(cc => { const s = document.createElement('canvas'); s.width = 800; s.height = 800; const x = s.getContext('2d'); const g = x.createLinearGradient(0, 0, 800, 800); g.addColorStop(0, cc[0]); g.addColorStop(1, cc[1]); x.fillStyle = g; x.fillRect(0, 0, 800, 800); x.fillStyle = 'rgba(255,255,255,.4)'; x.beginPath(); x.arc(560, 250, 110, 0, 7); x.fill(); x.beginPath(); x.moveTo(0, 800); x.lineTo(260, 430); x.lineTo(470, 640); x.lineTo(620, 480); x.lineTo(800, 620); x.lineTo(800, 800); x.closePath(); x.fill(); SAMPLE.push(s); }); return SAMPLE; }
  async function thumbs(){
    try{ await Promise.all([document.fonts.load('700 40px "Hind Siliguri"'), document.fonts.load('800 40px "Baloo Da 2"')]); }catch(e){}
    const sz = SIZES.post, k = 170 / sz.w, sm = samples(), d = { title: 'আমাদের সেই দিন', line: '', small: '', photos: sm };
    TPLS.forEach(t => { const cv = document.querySelector('#tpls canvas[data-k="' + t.k + '"]'); if(!cv) return; cv.width = Math.round(sz.w * k); cv.height = Math.round(sz.h * k); paint(cv, sz.w, sz.h, t.own ? Object.assign({}, d, { line: DEFTXT }) : d, t.k, k); });
  }

  /* ---------- the form ---------- */
  function paintTpls(){ $('tpls').innerHTML = TPLS.filter(t => !t.off).map(t => '<button type="button" role="radio" aria-checked="' + (S.tpl === t.k) + '" data-k="' + t.k + '"><canvas data-k="' + t.k + '"></canvas><span>' + t.n + (t.ph === 2 ? '<i>২ ছবি</i>' : t.ph === 0 ? '<i>শুধু লেখা</i>' : '') + '</span></button>').join(''); }
  function paintThemes(){ $('themes').innerHTML = Object.keys(THEMES).map(k => '<button type="button" role="radio" aria-checked="' + (S.theme === k) + '" data-k="' + k + '" style="background:' + THEMES[k].ac + '" aria-label="' + THEMES[k].n + '" title="' + THEMES[k].n + '"></button>').join(''); }
  function paintSize(){ $('size').innerHTML = Object.keys(SIZES).map(k => '<button type="button" role="radio" aria-checked="' + (S.size === k) + '" data-k="' + k + '">' + SIZES[k].n + '</button>').join(''); }
  function paintSlots(){
    const t = TP(), n = t.ph; $('phWrap').hidden = n === 0; $('stepW').textContent = n === 0 ? '২.' : '৩.'; $('txt').maxLength = t.own ? 320 : 160; $('txt').placeholder = t.own ? 'আপনার স্মৃতিটা লিখুন…' : TXT_PH; paintStarts(); $('phHint').textContent = n === 2 ? '(দুটো ছবি লাগবে)' : '';
    $('slots').innerHTML = Array.from({ length: n }, (_, i) => { const im = S.photos[i]; return '<div class="mc-slot' + (im ? ' has' : '') + '" data-i="' + i + '">' + (im ? '<img alt="" data-i="' + i + '"><button type="button" class="x" data-x="' + i + '" aria-label="ছবি সরান">×</button>' : '<button type="button" class="add" data-add="' + i + '"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><b>' + (n === 2 ? (t.k === 'thennow' ? (i ? 'এখনকার ছবি' : 'তখনকার ছবি') : 'ছবি ' + bn(i + 1)) : 'ছবি দিন') + '</b></button>') + '</div>'; }).join('');
    S.photos.forEach((im, i) => { const el = $('slots').querySelector('img[data-i="' + i + '"]'); if(el && im){ const s = document.createElement('canvas'); s.width = 160; s.height = 160; const x = s.getContext('2d'), sc = Math.max(160 / im.width, 160 / im.height); x.drawImage(im, 80 - im.width * sc / 2, 80 - im.height * sc / 2, im.width * sc, im.height * sc); el.src = s.toDataURL('image/jpeg', .7); } });
  }
  const TXT_PH = $('txt').placeholder;
  const STARTS = [['টিফিনের ঘণ্টা', 'ঘণ্টা বাজলেই দৌড়ে মাঠে যেতাম। পকেটে দু-টাকা থাকলে নিজেকে রাজা মনে হতো।'], ['বর্ষার দিন', 'বৃষ্টিতে ভিজে স্কুলে যাওয়া, ফেরার পথে কাদায় পা ডুবিয়ে হাঁটা। কী যে সুখ ছিল!'], ['শেষ বেঞ্চ', 'শেষ বেঞ্চে বসে স্যারের চোখ ফাঁকি দিয়ে গল্প করতাম। আজ সেই বেঞ্চটাই সবচেয়ে বেশি মনে পড়ে।'], ['বন্ধুরা কই?', 'সবাই এখন যে যার জীবনে ব্যস্ত। তবু ইচ্ছে করে, একটা দিন আবার সবাই একসাথে বসি।'], ['ঈদের সকাল', 'নতুন জামা, মায়ের হাতের সেমাই, সালামি গোনার সেই উত্তেজনা। ফিরে পেতে ইচ্ছে করে।'], ['প্রথম দিন', 'স্কুলের প্রথম দিনটা মনে আছে? মায়ের হাত শক্ত করে ধরে রেখেছিলাম, ছাড়তেই চাইনি।']];
  function paintStarts(){ const el = $('starts'), on = !!TP().own; el.hidden = !on; if(on && !el.dataset.done){ el.dataset.done = 1; el.innerHTML = '<span>কীভাবে শুরু করবেন? একটা বেছে নিন, তারপর নিজের কথায় বদলান</span>' + STARTS.map((x, q) => '<button type="button" data-q="' + q + '">' + x[0] + '</button>').join(''); } }
  $('starts').onclick = e => { const b = e.target.closest('button[data-q]'); if(!b) return; const x = STARTS[+b.dataset.q]; $('ttl').value = x[0]; $('txt').value = x[1]; counters(); draw(); track('memory_start', { q: +b.dataset.q }); };
  function counters(){ $('ttlN').textContent = bn($('ttl').value.length) + '/৪০'; }
  $('tpls').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.tpl = b.dataset.k; paintTpls(); thumbs(); paintSlots(); draw(); track('memory_tpl', { t: S.tpl }); };
  $('themes').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.theme = b.dataset.k; PAL = THEMES[S.theme]; paintThemes(); thumbs(); draw(); };
  $('size').onclick = e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.size = b.dataset.k; paintSize(); draw(); };
  ['ttl', 'txt', 'sm'].forEach(id => $(id).addEventListener('input', () => { counters(); draw(); }));

  /* photos: read in the browser, shrunk, kept in memory only; several picked at once fill the slots in order */
  let target = 0;
  $('slots').onclick = e => { const x = e.target.closest('button[data-x]'); if(x){ S.photos[+x.dataset.x] = null; paintSlots(); draw(); return; } const a = e.target.closest('button[data-add]'); if(a){ target = +a.dataset.add; $('file').click(); return; } const has = e.target.closest('.mc-slot.has'); if(has){ target = +has.dataset.i; $('file').click(); } };
  $('file').onchange = async () => {
    const files = Array.from($('file').files || []).filter(f => /^image\//.test(f.type)); $('file').value = ''; if(!files.length) return;
    let slot = target, put1 = 0;
    for(const f of files){
      if(slot >= TP().ph) break;
      try{
        let bmp; try{ bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }catch(e){ bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(f); }); }
        const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, sc = Math.min(1, 1600 / Math.max(w, h)), cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        S.photos[slot] = cv; slot++; put1++;
      }catch(e){ toast('একটা ছবি পড়া যায়নি।'); }
    }
    if(put1){ paintSlots(); draw(); }
  };

  /* what was written last time is kept in this browser (not the photos), so the next card starts faster */
  function saveDraft(){ try{ localStorage.setItem(DRAFT, JSON.stringify({ tpl: S.tpl, theme: S.theme, size: S.size, ttl: $('ttl').value, txt: $('txt').value, sm: $('sm').value })); }catch(e){} }
  function loadDraft(){ try{ const d = JSON.parse(localStorage.getItem(DRAFT) || 'null'); if(!d) return; if(TPLS.some(t => t.k === d.tpl && !t.off)) S.tpl = d.tpl; if(THEMES[d.theme]) S.theme = d.theme; if(SIZES[d.size]) S.size = d.size; $('ttl').value = String(d.ttl || '').slice(0, 40); $('txt').value = String(d.txt || '').slice(0, 320); $('sm').value = String(d.sm || '').slice(0, 40); }catch(e){} }

  /* ---------- download, share, caption ---------- */
  const capText = () => { const t = $('ttl').value.trim(), l = $('txt').value.trim(); return (t || 'একটা স্মৃতি') + (l ? '\n' + l : '') + '\n\nনিজের স্মৃতির কার্ড বানান 👇\nprotishthan.com/memory'; };
  const fileOf = () => new Promise(res => $('cv').toBlob(b => res(b ? new File([b], 'memory-card.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', .93));
  function count(){ let n = 0; try{ n = +localStorage.getItem('mem_n') || 0; }catch(e){} return n; }
  function bump(){ const n = count() + 1; try{ localStorage.setItem('mem_n', String(n)); }catch(e){} showCount(); }
  function showCount(){ const n = count(), p = $('cnt'); if(n){ p.textContent = 'আপনি এ পর্যন্ত ' + bn(n) + 'টা কার্ড বানিয়েছেন।'; p.hidden = false; } }
  $('dl').onclick = async () => { await render(); const f = await fileOf(); if(!f){ toast('কার্ড বানানো যায়নি, আবার চেষ্টা করুন।'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = 'memory-card.jpg'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); bump(); track('memory_download', { t: S.tpl, size: S.size, photos: S.photos.filter(Boolean).length }); toast('কার্ড ডাউনলোড হয়েছে।'); };
  $('sh').onclick = async () => { await render(); const f = await fileOf(); if(!f) return; try{ await navigator.share({ files: [f], text: capText() }); bump(); track('memory_share', { t: S.tpl }); }catch(e){} };
  $('cpCap').onclick = async () => { try{ await navigator.clipboard.writeText(capText()); }catch(e){ const t = document.createElement('textarea'); t.value = capText(); document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(_){} t.remove(); } toast('ক্যাপশন কপি হয়েছে।'); track('memory_caption', {}); };
  $('again').onclick = () => { ['ttl', 'txt', 'sm'].forEach(id => { $(id).value = ''; }); S.photos = [null, null]; counters(); paintSlots(); draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  /* start */
  loadDraft(); PAL = THEMES[S.theme] || THEMES.mint; paintTpls(); paintThemes(); paintSize(); paintSlots(); counters(); showCount();
  try{ const f = new File([''], 'x.png', { type: 'image/png' }); if(navigator.canShare && navigator.canShare({ files: [f] })) $('sh').hidden = false; }catch(e){}
  draw(); thumbs();
  /* the form stays in view while the long preview scrolls: it sticks when its bottom reaches the bottom of the screen (or its top, 88 px down, when it is shorter), never higher than 64 px so the header does not cover it */
  (function(){ const f = document.querySelector('.mc-form'); if(!f) return;
    const fit2 = () => { f.style.top = innerWidth <= 900 ? '' : Math.min(88, Math.max(64, innerHeight - f.offsetHeight - 24)) + 'px'; };
    fit2(); addEventListener('resize', fit2); if(window.ResizeObserver) new ResizeObserver(fit2).observe(f); })();
  track('memory_view', {});
})();
