<script>
(function(){
  'use strict';
  const bn = x => String(x).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const T = (n, p) => { try{ if(window.track) window.track(n, p || {}); }catch(e){} };
  const MB = () => (window.Protishthan && window.Protishthan.member) || null;
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const ID = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
  const ROOM = UUID.test(ID);
  const L = ['ক', 'খ', 'গ', 'ঘ'];
  const toast = m => { const t = $('chToast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); };
  const rpc = async (n, a) => { const M = MB(); if(!M || !M.sb) return { error: { message: 'NO_CLIENT' } }; try{ return await M.sb.rpc(n, a || {}); }catch(e){ return { error: { message: String(e && e.message || e) } }; } };
  const signedIn = () => { const M = MB(); return !!(M && M.current && M.current()); };
  // "বুধবার ১৮ নভেম্বর, রাত ৯:০০": the part of the day in words, the hour on a 12-hour clock
  const fmtWhen = ms => { const d = new Date(ms), h = d.getHours(), m = d.getMinutes(), part = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 15 ? 'দুপুর' : h < 17 ? 'বিকাল' : h < 19 ? 'সন্ধ্যা' : 'রাত', h12 = h % 12 === 0 ? 12 : h % 12; return d.toLocaleDateString('bn-BD', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + part + ' ' + bn(h12) + ':' + bn(String(m).padStart(2, '0')); };
  const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? bn(h) + ':' + bn(String(m).padStart(2, '0')) : bn(m)) + ':' + bn(String(x).padStart(2, '0')); };
  const sign = why => { T('ch_signin_click', {}); const M = MB(); if(M) M.signIn(why || 'ব্যাচ চ্যালেঞ্জে যোগ দিতে', { title: 'ব্যাচ চ্যালেঞ্জে যোগ দিন', cta: 'Google দিয়ে চালিয়ে যান', perks: [['users', 'আপনার ব্যাচের সবার সঙ্গে একই সময়ে খেলুন'], ['seat', 'আপনার সঠিক উত্তর ব্যাচের বার ভরায়'], ['eye', 'শুধু ব্যাচের সদস্যরাই অংশ নিতে পারে']] }); };

  /* ---------- the clock: every phone learns how far it is from the server's clock ---------- */
  let OFF = 0;
  const now = () => Date.now() + OFF;
  async function syncClock(){
    let best = null;
    for(let i = 0; i < 4; i++){
      const t0 = Date.now();
      try{ const r = await fetch('/api/time', { cache: 'no-store' }); if(!r.ok) throw new Error('x'); const j = await r.json(), t1 = Date.now(), rtt = t1 - t0; if(typeof j.now === 'number'){ const off = j.now + rtt / 2 - t1; if(!best || rtt < best.rtt) best = { rtt, off }; } }catch(e){}
      await sleep(100);
    }
    if(!best && ROOM){          // no time service (a test server): the database answers with its clock
      for(let i = 0; i < 3; i++){ const t0 = Date.now(), r = await rpc('challenge_state', { p_id: ID }), t1 = Date.now(); if(r.data && r.data.server_now_ms){ const rtt = t1 - t0, off = r.data.server_now_ms + rtt / 2 - t1; if(!best || rtt < best.rtt) best = { rtt, off }; } await sleep(100); }
    }
    if(best) OFF = best.off;
    return !!best;
  }
  let EDGE_DOWN = 0;          // until when the edge is not asked (it did not answer: the free daily limit, a 404 or a 5xx): the database answers directly
  const edgeUp = () => Date.now() > EDGE_DOWN;
  const edgeFail = () => { EDGE_DOWN = Date.now() + 60000; };
  const state = async id => {
    if(edgeUp()){ try{ const r = await fetch('/api/challenge?f=state&id=' + encodeURIComponent(id), { cache: 'no-store' }); if(r.ok){ const j = await r.json(); if(j && j.found !== undefined) return j; } else if(r.status === 404 || r.status >= 500) edgeFail(); }catch(e){ edgeFail(); } }
    const d = await rpc('challenge_state', { p_id: id }); return d.data || null;
  };
  const list = async () => {
    if(edgeUp()){ try{ const r = await fetch('/api/challenge?f=list', { cache: 'no-store' }); if(r.ok){ const j = await r.json(); if(Array.isArray(j)) return j; } else if(r.status === 404 || r.status >= 500) edgeFail(); }catch(e){ edgeFail(); } }
    const d = await rpc('challenge_list', { p_limit: 30 }); return Array.isArray(d.data) ? d.data : null;
  };
  const name = b => b ? (b.name || 'ব্যাচ') + ' · ' + bn(b.year || '') + ' ব্যাচ' : 'ব্যাচ';
  const isRope = S => !!S && S.mode === 'rope';
  const num1 = x => bn((Math.round((+x || 0) * 10) / 10).toString());
  const shareText = S => isRope(S)
    ? '🪢 রশি টানাটানি! ' + name(S.batch) + (S.opp ? ' বনাম ' + name(S.opp) : ' এখন একটা বিপক্ষ ব্যাচ খুঁজছে') + ', ' + fmtWhen(S.start_ms) + '। একই ' + bn(S.slots) + 'টা প্রশ্ন, একই সময়ে, কার ব্যাচ বেশি পারে?' + (S.opp ? '' : ' আপনার ব্যাচ চ্যালেঞ্জ নিতে পারে।') + '\nদেখুন ও যোগ দিন: https://protishthan.com/challenge?c=' + S.id
    : '🏁 ব্যাচ চ্যালেঞ্জ! ' + name(S.batch) + ' ' + fmtWhen(S.start_ms) + '-এ ' + bn(S.slots) + 'টা প্রশ্নে ' + bn(S.target) + 'টা সঠিক উত্তরের লক্ষ্য। আপনি আসছেন?\nযোগ দিন: https://protishthan.com/challenge?c=' + S.id;

  /* =====================================================  THE HUB  ===================================================== */
  const HUB = { batches: null, target: 60, mode: 'clock', vs: null, vsInfo: null };
  const VS = (new URLSearchParams(location.search).get('vs') || '').toLowerCase();
  async function hub(){
    const root = $('chRoot');
    root.innerHTML = '<header class="ch-hero"><a class="ch-kick" href="/league" style="text-decoration:none">🏆 প্রতিষ্ঠান লিগ</a><h1>ব্যাচ <span>চ্যালেঞ্জ</span></h1><p>আপনার ব্যাচের সবাই ঠিক একই সময়ে একই ১২টা প্রশ্নের উত্তর দেয়। সবার সঠিক উত্তর মিলে বার ভরে। লক্ষ্য ছুঁলে জয়।</p></header>' +
      '<section class="ch-sec"><h2>আসছে ও চলছে</h2><p>যেকোনো চ্যালেঞ্জে চাপলে দেখতে পারবেন। অংশ নিতে হলে আপনাকে ঐ ব্যাচের সদস্য হতে হবে।</p><ul class="ch-list" id="chList"><li class="ch-empty">লোড হচ্ছে…</li></ul></section>' +
      '<section class="ch-sec" id="chMake"><h2>চ্যালেঞ্জ দিন</h2><p>ব্যাচের একজন সদস্য সময় ঠিক করলেই হয়। তারপর ব্যাচের গ্রুপে লিংক পাঠান।</p><div class="ch-card" id="chFormBox"><div class="ch-skel" style="height:120px"></div></div></section>' +
      '<section class="ch-how"><h2>কীভাবে খেলা হয়</h2><ol><li>ব্যাচের একজন সময় আর লক্ষ্য ঠিক করে চ্যালেঞ্জ দেয়, তারপর ব্যাচের গ্রুপে লিংক পাঠায়।</li><li>শুরুর ৫ মিনিট আগে "লবি" খোলে। "আমি আছি" চেপে যোগ দিন, কতজন এসেছেন দেখা যায়।</li><li>ঘড়ি ০ হলেই সবার ফোনে একসঙ্গে প্রথম প্রশ্ন। প্রতিটা প্রশ্নের জন্য ১২ সেকেন্ড, মোট ১২টা প্রশ্ন।</li><li>ব্যাচের সবার সঠিক উত্তর যোগ হয়ে একটা বার ভরে। লক্ষ্য ছুঁলে ব্যাচ জেতে।</li><li>শেষে ফল, আর সেরা ৫ জনের প্রথম নাম। শুধু যাঁরা খেলেছেন তাঁরাই নাম দেখেন।</li></ol><h3>🪢 রশি টানাটানি: ব্যাচ বনাম ব্যাচ</h3><ol><li>একই ১২টা প্রশ্ন, একই সময়ে। দুই ব্যাচ রশির দুই মাথায়।</li><li>প্রতি ব্যাচের খেলোয়াড়পিছু গড় সঠিক উত্তর মেলানো হয়, তাই বড় ব্যাচ বলে বাড়তি সুবিধা নেই।</li><li>যার গড় বেশি, রশির গিঁট তার দিকে সরে। শেষে যার গড় বেশি, সে জেতে (সমান হলে ড্র)।</li><li>বিপক্ষ ঠিক না করলে যেকোনো ব্যাচ "চ্যালেঞ্জ নিলাম" চেপে বিপক্ষ হতে পারে। দুই পক্ষেই অন্তত ৫ জন না থাকলে খেলা গোনা হয় না।</li></ol></section>';
    T('ch_hub_view', { signed: signedIn() ? 1 : 0 });
    const M = MB(); if(M && M.ready) await M.ready();
    paintForm(); loadList(); setInterval(loadList, 20000); if(M && M.onChange) M.onChange(() => paintForm());
  }
  async function loadList(){
    const ul = $('chList'); if(!ul) return;
    const r = await list();
    if(!r){ ul.innerHTML = '<li class="ch-empty">এখন লোড করা যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।</li>'; return; }
    if(!r.length){ ul.innerHTML = '<li class="ch-empty">এখন কোনো চ্যালেঞ্জ নেই।<br>আপনার ব্যাচই প্রথম চ্যালেঞ্জ দিতে পারে, নিচে সময় ঠিক করুন।</li>'; return; }
    const rank = { live: 0, lobby: 1, scheduled: 2, done: 3 }, rows = r.slice().sort((a, b) => (rank[a.status] - rank[b.status]) || (a.status === 'done' ? b.start_ms - a.start_ms : a.start_ms - b.start_ms));
    const lab = { live: 'চলছে', lobby: 'লবি খোলা', scheduled: 'আসছে', done: 'শেষ' };
    ul.innerHTML = rows.map(c => {
      const rp = isRope(c), t = rp ? '🪢 ' + esc(name(c.batch)) + ' <em>বনাম</em> ' + (c.opp ? esc(name(c.opp)) : '<i>বিপক্ষ খোঁজা হচ্ছে</i>') : esc(name(c.batch));
      const sub = esc(fmtWhen(c.start_ms)) + (rp ? '' : ' · লক্ষ্য ' + bn(c.target) + 'টা') + ' · ' + bn(c.players) + ' জন' + (!rp && (c.status === 'done' || c.status === 'live') ? ' · সঠিক ' + bn(c.correct) : '') + (rp && c.open && c.status !== 'done' ? ' · যেকোনো ব্যাচ চ্যালেঞ্জ নিতে পারে' : '');
      return '<li><a class="ch-row ' + c.status + (rp ? ' rope' : '') + '" href="/challenge?c=' + c.id + '"><div><b>' + t + '</b><small>' + sub + '</small></div><span class="ch-pill ' + c.status + '">' + lab[c.status] + '</span></a></li>';
    }).join('');
  }
  async function paintForm(){
    const box = $('chFormBox'); if(!box) return;
    if(!signedIn()){ box.innerHTML = '<div class="ch-cen"><h2>আগে সাইন-ইন করুন</h2><p>চ্যালেঞ্জ দিতে আপনার নিজের ব্যাচের সদস্য হতে হবে।</p><button type="button" class="ch-go" id="chSign">Google দিয়ে সাইন-ইন করুন</button></div>'; $('chSign').onclick = () => sign('চ্যালেঞ্জ দিতে সাইন-ইন করুন'); return; }
    const r = await rpc('batch_me');
    if(r.error || !Array.isArray(r.data)){ box.innerHTML = '<div class="ch-empty">এখন লোড করা যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।</div>'; return; }
    HUB.batches = r.data.filter(b => b.level === 'ssc');
    if(UUID.test(VS) && !HUB.vs){ const v = await rpc('challenge_batch_info', { p_batch: VS }); if(v.data && v.data.id){ HUB.vs = v.data.id; HUB.vsInfo = v.data; HUB.mode = 'rope'; } }
    if(!HUB.batches.length){ box.innerHTML = '<div class="ch-cen"><h2>আপনি এখনও কোনো ব্যাচে নেই</h2><p>আগে আপনার SSC ব্যাচে যোগ দিন, তারপর চ্যালেঞ্জ দেওয়া যাবে।</p><a class="ch-go" href="/#" id="chFind">ব্যাচ খুঁজুন</a></div>'; $('chFind').onclick = e => { e.preventDefault(); if(window.MyInst && MyInst.open) MyInst.open({ mode: 'batch' }); else location.href = 'member.html#life'; }; return; }
    const d = new Date(Date.now() + 3600e3 * 1.2); d.setMinutes(0, 0, 0); let def = new Date(); def.setHours(21, 0, 0, 0); if(def.getTime() < Date.now() + 3600e3) def = new Date(def.getTime() + 864e5);
    const loc = x => { const p = n => String(n).padStart(2, '0'); return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate()) + 'T' + p(x.getHours()) + ':' + p(x.getMinutes()); };
    box.innerHTML = '<form class="ch-form" id="chForm"><label for="chBatch">কোন ব্যাচ?</label><select class="ch-in" id="chBatch">' + HUB.batches.map(b => '<option value="' + esc(b.batch_id) + '">' + esc((b.name || b.slug) + ' · ' + bn(b.year) + ' ব্যাচ (' + bn(b.members || 0) + ' জন)') + '</option>').join('') + '</select>' +
      '<label>কেমন খেলা?</label><div class="ch-modes" id="chModes"><button type="button" class="ch-mode on" data-m="clock"><b>ব্যাচ বনাম ঘড়ি</b><small>সবাই মিলে লক্ষ্য ছোঁয়া</small></button><button type="button" class="ch-mode" data-m="rope"><b>🪢 রশি টানাটানি</b><small>ব্যাচ বনাম ব্যাচ</small></button></div>' +
      '<label for="chWhen">কখন? (অন্তত ১৫ মিনিট পরে, ৭ দিনের মধ্যে)</label><input class="ch-in" type="datetime-local" id="chWhen" value="' + loc(def) + '" min="' + loc(new Date(Date.now() + 16 * 60e3)) + '" max="' + loc(new Date(Date.now() + 7 * 864e5 - 60e3)) + '">' +
      '<div class="ch-hint">সবাইকে জানানোর জন্য অন্তত ১ ঘণ্টা সময় রাখা ভালো। রাত ৮-১০টায় বেশি মানুষ থাকে।</div>' +
      '<div id="chClockOpts"><label>লক্ষ্য: সবাই মিলে কতগুলো সঠিক উত্তর?</label><div class="ch-targets" id="chTargets"><button type="button" class="ch-t" data-t="30">৩০<small>ছোট ব্যাচ</small></button><button type="button" class="ch-t on" data-t="60">৬০<small>মাঝারি</small></button><button type="button" class="ch-t" data-t="100">১০০<small>বড় ব্যাচ</small></button></div>' +
      '<div class="ch-hint">১২টা প্রশ্ন। ১০ জন এলে সর্বোচ্চ ১২০টা সঠিক উত্তর হতে পারে, তাই বেশি মানুষ এলে বড় লক্ষ্য নিন।</div></div>' +
      '<div id="chRopeOpts" hidden><label>কার বিপক্ষে?</label><div class="ch-vs" id="chVs"></div><div class="ch-hint">একই ১২টা প্রশ্ন, একই সময়ে। দুই ব্যাচের খেলোয়াড়পিছু গড় সঠিক উত্তর মেলানো হয়, তাই বড় ব্যাচ বলে বাড়তি সুবিধা নেই। যে ব্যাচের গড় বেশি, রশি তাদের দিকে যায়। দুই পক্ষেই অন্তত ৫ জন না থাকলে খেলা গোনা হয় না।</div></div>' +
      '<div class="ch-err" id="chErr" hidden></div><div style="margin-top:16px"><button type="submit" class="ch-go" id="chCreate">চ্যালেঞ্জ দিন</button></div></form>';
    $('chTargets').onclick = e => { const b = e.target.closest('.ch-t'); if(!b) return; HUB.target = +b.dataset.t; document.querySelectorAll('.ch-t').forEach(x => x.classList.toggle('on', x === b)); };
    HUB.target = 60;
    const paintMode = () => {
      const rp = HUB.mode === 'rope'; $('chClockOpts').hidden = rp; $('chRopeOpts').hidden = !rp;
      document.querySelectorAll('.ch-mode').forEach(x => x.classList.toggle('on', x.dataset.m === HUB.mode));
      $('chCreate').textContent = rp ? 'রশি টানাটানির চ্যালেঞ্জ দিন' : 'চ্যালেঞ্জ দিন';
      const vs = $('chVs'); if(!vs) return;
      vs.innerHTML = HUB.vs && HUB.vsInfo
        ? '<div class="ch-vsrow on"><b>' + esc(name(HUB.vsInfo)) + '</b><small>' + bn(HUB.vsInfo.members || 0) + ' জন সদস্য · আপনি নাম ধরে চ্যালেঞ্জ দিচ্ছেন</small></div><button type="button" class="ch-linkbtn" id="chVsAny">না, যেকোনো ব্যাচ হোক</button>'
        : '<div class="ch-vsrow on"><b>যেকোনো ব্যাচ</b><small>যে ব্যাচ আগে "চ্যালেঞ্জ নিলাম" চাপবে, তারাই আপনাদের বিপক্ষ</small></div>';
      if($('chVsAny')) $('chVsAny').onclick = () => { HUB.vs = null; HUB.vsInfo = null; paintMode(); };
    };
    $('chModes').onclick = e => { const b = e.target.closest('.ch-mode'); if(!b) return; HUB.mode = b.dataset.m; paintMode(); };
    paintMode();
    $('chForm').onsubmit = async e => {
      e.preventDefault(); const err = $('chErr'), btn = $('chCreate'); err.hidden = true;
      const at = new Date($('chWhen').value); if(!(at.getTime() > Date.now())){ err.textContent = 'সময়টা ঠিক করে দিন।'; err.hidden = false; return; }
      const rp = HUB.mode === 'rope';
      btn.disabled = true;
      const r = rp ? await rpc('rope_create', { p_batch_id: $('chBatch').value, p_start: at.toISOString(), p_opp_batch: HUB.vs || null })
                   : await rpc('challenge_create', { p_batch_id: $('chBatch').value, p_start: at.toISOString(), p_target: HUB.target });
      btn.disabled = false;
      const x = r.data;
      if(r.error || !x){ err.textContent = 'এখন হলো না, একটু পরে আবার চেষ্টা করুন।'; err.hidden = false; return; }
      if(x.ok){ T('ch_created', rp ? { mode: 'rope', named: HUB.vs ? 1 : 0 } : { target: HUB.target }); location.href = '/challenge?c=' + x.id + '&new=1'; return; }
      const MSG = { NOT_SIGNED_IN: 'আগে সাইন-ইন করুন।', NOT_MEMBER: 'এই ব্যাচের সদস্য না হলে চ্যালেঞ্জ দেওয়া যায় না।', TOO_SOON: 'অন্তত ১৫ মিনিট পরের সময় দিন।', TOO_FAR: 'সর্বোচ্চ ৭ দিন পরের সময় দেওয়া যায়।', BAD_TARGET: 'লক্ষ্যটা ঠিক নেই।', BATCH_TOO_SMALL: 'ব্যাচে অন্তত ৫ জন সদস্য না হলে চ্যালেঞ্জ দেওয়া যায় না। আগে বন্ধুদের ব্যাচে ডাকুন।', NOT_ENOUGH_QUESTIONS: 'এখন চ্যালেঞ্জের মতো যথেষ্ট প্রশ্ন তৈরি নেই। কয়েক দিন পরে আবার চেষ্টা করুন।', LIMIT_USER: 'আপনি আজ একটা চ্যালেঞ্জ দিয়েছেন। ২৪ ঘণ্টায় একটাই দেওয়া যায়।', LIMIT_BATCH: 'এই ব্যাচের দুটো চ্যালেঞ্জ আগেই অপেক্ষায় আছে।', TOO_CLOSE: 'এই ব্যাচের আরেকটা চ্যালেঞ্জ এর আধা ঘণ্টার মধ্যেই আছে। অন্য সময় বাছুন।', SAME_BATCH: 'নিজের ব্যাচের বিপক্ষে নিজেরাই খেলা যায় না। অন্য ব্যাচ বাছুন, বা "যেকোনো ব্যাচ" রাখুন।', OPP_NOT_FOUND: 'ঐ ব্যাচটা পাওয়া যায়নি। "যেকোনো ব্যাচ" বেছে চেষ্টা করুন।', OPP_TOO_SMALL: 'ঐ ব্যাচে এখনও ৫ জন সদস্য নেই, তাই তাদের চ্যালেঞ্জ দেওয়া যাচ্ছে না। "যেকোনো ব্যাচ" বেছে দেখুন।', OPP_BUSY: 'ঐ ব্যাচের হাতে এই সময়ের কাছাকাছি আরেকটা চ্যালেঞ্জ আছে। অন্য সময় বাছুন।' };
      err.textContent = MSG[x.error] || 'চ্যালেঞ্জ দেওয়া গেল না।'; err.hidden = false;
    };
  }

  /* =====================================================  THE ROOM  ===================================================== */
  const R = { S: null, me: null, qs: null, mine: {}, correct: 0, phase: '', slot: -2, answeredNow: false, result: null, polling: false, qFetching: false, resultFetching: false, lastPaint: '', pendingSlot: -1, flash: '' };
  const phaseOf = () => {
    const S = R.S; if(!S || S.found === false) return 'missing'; if(S.status === 'cancelled') return 'cancelled';
    const t = now(), st = S.start_ms, end = st + S.slots * S.slot_s * 1000;
    return t < st - 300000 ? 'scheduled' : t < st ? 'lobby' : t < end ? 'live' : 'done';
  };
  const curSlot = () => { const S = R.S; return S ? Math.floor((now() - S.start_ms) / (S.slot_s * 1000)) : -1; };
  async function room(){
    const root = $('chRoot'); root.innerHTML = '<div class="ch-skel"></div>';
    const M = MB(); if(M && M.ready) await M.ready();
    await syncClock();
    R.S = await state(ID);
    if(!R.S || R.S.found === false){ root.innerHTML = '<div class="ch-card ch-cen"><h2>এই চ্যালেঞ্জ পাওয়া যায়নি</h2><p>লিংকটা ঠিক আছে কিনা দেখুন, বা চ্যালেঞ্জটা বাতিল হয়ে থাকতে পারে।</p><a class="ch-go" href="/challenge">সব চ্যালেঞ্জ দেখুন</a></div>'; return; }
    await loadMe();
    T('ch_room_view', { signed: signedIn() ? 1 : 0, member: R.me && R.me.member ? 1 : 0, phase: phaseOf() });
    paintRoom(true); setInterval(tick, 200); pollLoop(); setInterval(() => syncClock(), 300000);
    if(M && M.onChange) M.onChange(async () => { await loadMe(); paintRoom(true); });
    document.addEventListener('visibilitychange', () => { if(!document.hidden){ tick(); } });
  }
  async function loadMe(){
    const r = await rpc('challenge_me', { p_id: ID }); R.me = (!r.error && r.data) ? r.data : { signed_in: signedIn(), member: false, joined: false, answers: [], creator: false, side: null, accept_batches: [] };
    (R.me.answers || []).forEach(a => { if(a.correct != null && !R.mine[a.slot]) R.mine[a.slot] = { correct: a.correct, restored: true }; });
    R.correct = Math.max(R.correct, (R.me.answers || []).filter(a => a.correct).length);
  }
  async function pollLoop(){
    if(R.polling) return; R.polling = true;
    while(true){
      const ph = phaseOf();
      if(ph === 'done' && R.result){ break; }
      const s = await state(ID); if(s && s.found !== false){ const was = !!(R.S && R.S.opp); R.S = s; if(isRope(s) && was !== !!s.opp){ await loadMe(); R.lastPaint = ''; } paintBar(); }
      const toStart = R.S.start_ms - now();
      await sleep(ph === 'live' || (ph === 'lobby' && toStart <= 20000) ? 2500 + Math.random() * 500 : ph === 'lobby' ? 5000 + Math.random() * 1500 : ph === 'done' ? 4000 : 40000 + Math.random() * 10000);
    }
  }

  /* the loop: 5 times a second; it repaints only when something that the screen shows has changed */
  function tick(){
    const ph = phaseOf(), S = R.S; if(!S) return;
    const st = S.start_ms, t = now();
    let slot = -1, open = false, inSlot = 0;
    if(ph === 'live'){ const ms = S.slot_s * 1000; slot = Math.floor((t - st) / ms); inSlot = (t - st) - slot * ms; open = inSlot < S.window_s * 1000; }
    // the questions: fetched in the 4 seconds before the start, spread over about 2.5 seconds so that everybody does not ask at the same instant; late joiners fetch at once
    if(!R.qs && !R.qFetching && R.me && R.me.member && signedIn() && (ph === 'live' || (ph === 'lobby' && t >= st - 3800 - 0))) fetchQuestions();
    if(ph === 'done' && !R.result && !R.resultFetching) fetchResult();
    const key = ph + '|' + slot + '|' + (open ? 1 : 0) + '|' + (R.mine[slot] ? 1 : 0) + '|' + (R.qs ? 1 : 0) + '|' + (R.me ? (R.me.joined ? 1 : 0) : 'x') + '|' + (R.result ? 1 : 0) + '|' + R.flash + '|' + (S.opp ? S.opp.id : '') + '|' + (R.me && R.me.side || '') + '|' + ((R.me && R.me.accept_batches || []).length);
    if(key !== R.lastPaint){ R.lastPaint = key; R.phase = ph; R.slot = slot; paintRoom(false); }
    // the numbers that move every tick
    const c = $('chClock'); if(c){ if(ph === 'scheduled') c.textContent = fmtClock(st - 300000 - t); else if(ph === 'lobby'){ const left = st - t; c.textContent = left <= 10000 ? bn(Math.ceil(left / 1000)) : fmtClock(left); c.classList.toggle('go', left <= 10000); } }
    const sec = $('chSec'), tb = $('chTb'); if(sec && tb && ph === 'live'){ const left = Math.max(0, S.window_s * 1000 - inSlot); sec.textContent = bn(Math.ceil(left / 1000)); $('chTbi').style.width = Math.min(100, left / (S.window_s * 1000) * 100) + '%'; const hot = left < 4000; sec.classList.toggle('hot', hot); tb.classList.toggle('hot', hot); }
  }
  async function fetchQuestions(){
    R.qFetching = true;
    const S = R.S, ph = phaseOf(); if(ph === 'lobby') await sleep(Math.random() * 1800);
    for(let i = 0; i < 6 && !R.qs; i++){
      const r = await rpc('challenge_questions', { p_id: ID }), d = r.data;
      if(d && d.ok && Array.isArray(d.questions)){ R.qs = d.questions; if(R.me) R.me.joined = true; break; }
      if(d && d.error === 'TOO_EARLY'){ await sleep(400); continue; }
      if(d && (d.error === 'NOT_MEMBER' || d.error === 'CANCELLED' || d.error === 'NOT_SIGNED_IN')) break;
      await sleep(500 + i * 300);
    }
    R.qFetching = false; if(R.qs){ R.lastPaint = ''; tick(); }
  }
  async function fetchResult(){
    R.resultFetching = true; await sleep(Math.random() * 5000);
    for(let i = 0; i < 4 && !R.result; i++){ const r = await rpc('challenge_result', { p_id: ID }); if(r.data && r.data.ok){ R.result = r.data; break; } await sleep(1500); }
    R.resultFetching = false; if(R.result && isRope(R.S)) ['lead', 'avg_a', 'avg_b', 'players_a', 'players_b', 'correct_a', 'correct_b', 'valid', 'winner', 'players', 'correct', 'opp'].forEach(k => { R.S[k] = R.result[k]; });
    if(R.result){ T('ch_done', { played: R.result.played ? 1 : 0, reached: R.result.reached ? 1 : 0, correct: R.result.correct }); R.lastPaint = ''; tick(); }
  }

  /* ---------- painting ---------- */
  /* ---------- the rope ---------- */
  const figs = n => { const k = Math.min(8, Math.max(0, n | 0)); let h = ''; for(let i = 0; i < k; i++) h += '<span class="rp-fig">🧍</span>'; return h + ((n | 0) > 8 ? '<span class="rp-more">+' + bn((n | 0) - 8) + '</span>' : ''); };
  function ropeBlock(){
    const S = R.S;
    return '<div class="rp" id="chRope" role="img" aria-label="রশি টানাটানি: রশির গিঁট এখন যার দিকে, সে এগিয়ে"><div class="rp-names"><b class="a">' + esc(name(S.batch)) + '</b><b class="b">' + (S.opp ? esc(name(S.opp)) : 'বিপক্ষ খোঁজা হচ্ছে…') + '</b></div>' +
      '<div class="rp-field"><div class="rp-side a" id="rpA"></div><div class="rp-track"><i class="rp-line l"></i><i class="rp-line r"></i><div class="rp-rope"></div><div class="rp-knot" id="rpKnot">🚩</div></div><div class="rp-side b" id="rpB"></div></div>' +
      '<div class="rp-nums"><div class="a" id="rpNA"></div><div class="b" id="rpNB"></div></div><div class="rp-note" id="rpNote"></div></div>';
  }
  function paintRope(){
    const S = R.S; if(!S || !$('chRope')) return;
    const ph = phaseOf(), done = ph === 'done', pa = S.players_a || 0, pb = S.players_b || 0;
    let pos = 50 - Math.max(-1, Math.min(1, (S.lead || 0) / 4)) * 38;
    if(done && S.valid) pos = S.winner === 'a' ? 12 : S.winner === 'b' ? 88 : 50;
    if(!S.opp || (!pa && !pb)) pos = 50;
    $('rpKnot').style.left = pos + '%';
    $('chRope').classList.toggle('lead-a', !!S.opp && pos < 46); $('chRope').classList.toggle('lead-b', !!S.opp && pos > 54);
    $('rpA').innerHTML = figs(pa); $('rpB').innerHTML = figs(pb);
    $('rpNA').innerHTML = '<b>' + num1(S.avg_a) + '</b> গড় সঠিক · ' + bn(pa) + ' জন'; $('rpNB').innerHTML = S.opp ? '<b>' + num1(S.avg_b) + '</b> গড় সঠিক · ' + bn(pb) + ' জন' : '—';
    let note = '';
    if(!S.opp) note = 'এখনও কোনো ব্যাচ চ্যালেঞ্জ নেয়নি। শুরুর আগে কেউ না নিলে এটা ঘড়ির বিপক্ষে খেলা হিসেবে ধরা হবে।';
    else if(!done && !S.valid) note = 'জয়-পরাজয় গোনা হবে যখন দুই পক্ষেই অন্তত ৫ জন আসবেন (এখন ' + bn(pa) + ' আর ' + bn(pb) + ' জন)।';
    else if(!done && ph === 'live') note = (S.lead || 0) > 0 ? esc(name(S.batch)) + ' এগিয়ে' : (S.lead || 0) < 0 ? esc(name(S.opp)) + ' এগিয়ে' : 'সমান সমান';
    $('rpNote').innerHTML = note;
  }
  function paintBar(){
    const S = R.S;
    if(isRope(S)){ paintRope(); return; }
    const b = $('chBar'); if(!S || !b) return;
    const pct = Math.min(100, S.correct / S.target * 100), win = S.correct >= S.target;
    b.classList.toggle('win', win); $('chBarI').style.width = pct + '%'; $('chBarT').textContent = bn(S.correct) + ' / ' + bn(S.target) + (win ? ' 🎉' : '');
    const p = $('chPlayers'); if(p) p.textContent = bn(S.players) + ' জন';
  }
  function ropeHead(){
    const S = R.S;
    return '<header class="ch-head"><span class="ch-kick">🪢 রশি টানাটানি</span><h1>' + esc(name(S.batch)) + ' <em class="vs">বনাম</em> ' + (S.opp ? esc(name(S.opp)) : '<i>বিপক্ষ খোঁজা হচ্ছে</i>') + '</h1><p>' + esc(fmtWhen(S.start_ms)) + ' · একই ' + bn(S.slots) + 'টা প্রশ্ন, একই সময়ে · খেলোয়াড়পিছু গড় সঠিক উত্তর যার বেশি, রশি তার দিকে</p></header>' + ropeBlock();
  }
  function head(){
    const S = R.S;
    if(isRope(S)) return ropeHead();
    return '<header class="ch-head"><span class="ch-kick">🏁 ব্যাচ চ্যালেঞ্জ</span><h1>' + esc(name(S.batch)) + '</h1><p>' + esc(fmtWhen(S.start_ms)) + ' · ' + bn(S.slots) + 'টা প্রশ্ন · লক্ষ্য ' + bn(S.target) + 'টা সঠিক উত্তর</p></header>' +

    if(!confirm('চ্যালেঞ্জটা বাতিল করবেন?')) return;
    const r = await rpc('challenge_cancel', { p_id: ID }), d = r.data;
    if(d && d.ok){ T('ch_cancel', {}); R.S.status = 'cancelled'; R.lastPaint = ''; paintRoom(true); } else toast(d && d.error === 'ALREADY_STARTED' ? 'শুরু হয়ে গেছে, বাতিল করা যায় না' : 'এখন হলো না');
  }
  async function answer(choice){
    const slot = curSlot(); if(R.mine[slot] || slot < 0 || slot >= R.S.slots) return;
    R.mine[slot] = { choice, correct: null };                       // locked at once: one answer, no second tap
    R.lastPaint = ''; tick();
    const r = await rpc('challenge_answer', { p_id: ID, p_slot: slot, p_choice: choice }), d = r.data;
    if(d && d.ok){ R.mine[slot] = { choice, correct: d.correct, answer_idx: d.answer_idx, explanation: d.explanation }; R.correct = d.my_correct; T('ch_answer', { s: slot, c: d.correct ? 1 : 0 }); }
    else if(d && d.error === 'ALREADY'){ /* answered on another screen: the state of the server wins */ await loadMe(); }
    else if(d && d.error === 'NOT_IN_WINDOW'){ delete R.mine[slot]; R.flash = ''; toast('সময় পেরিয়ে গেছে'); }
    else { delete R.mine[slot]; toast('নেটওয়ার্কে সমস্যা, আবার চাপুন'); }
    R.lastPaint = ''; tick();
  }

  window.__ch = { R, tick, phaseOf, now, syncClock, hub, room };
  (async () => { if(ROOM) await room(); else await hub(); })();
})();
</script>
