<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অভিভাবক ড্যাশবোর্ড — Protishthan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A56DB;--blue-dark:#1044B0;--blue-light:#EEF3FF;--blue-mid:#3B6FE0;
  --text:#0F172A;--text-2:#475569;--text-3:#94A3B8;
  --white:#fff;--border:#E2E8F0;--surface:#F8FAFF;--bg:#F1F5F9;
  --green:#059669;--green-l:#ECFDF5;
  --amber:#D97706;--amber-l:#FFFBEB;
  --red:#DC2626;--red-l:#FEF2F2;
  --purple:#7C3AED;--purple-l:#F5F3FF;
  --r:10px;--rl:16px;--rxl:20px;
}
html,body{height:100%;font-family:'Inter','Hind Siliguri',sans-serif;color:var(--text);background:var(--bg)}

/* TOP HEADER */
.header{background:linear-gradient(135deg,#0A1628,#1A3570);padding:20px 20px 60px;position:relative;overflow:hidden}
.header-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px}
.header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;margin-bottom:20px}
.logo{font-size:18px;font-weight:900;color:white}
.logo span{opacity:.5}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.logout-btn:hover{background:rgba(255,255,255,.18)}
.inbox-btn{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.inbox-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;background:#DC2626;border-radius:50%;border:1.5px solid #0A1628}

.greeting{position:relative;z-index:2;text-align:center}
.greeting-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:4px}
.greeting h1{font-size:20px;font-weight:800;color:white}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);color:#34D399;font-size:11px;font-weight:600;padding:4px 12px;border-radius:100px;margin-top:10px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#34D399;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}

/* CHILD SWITCHER */
.child-switcher{display:flex;gap:8px;overflow-x:auto;padding:0 4px;margin-top:18px;position:relative;z-index:2}
.child-switcher::-webkit-scrollbar{display:none}
.child-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:100px;cursor:pointer;transition:all .2s}
.child-chip.active{background:white;border-color:white}
.child-chip-avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:700}
.child-chip.active .child-chip-avatar{background:var(--blue-light);color:var(--blue)}
.child-chip-name{font-size:12px;font-weight:600;color:white;white-space:nowrap}
.child-chip.active .child-chip-name{color:var(--text)}

/* MAIN CONTENT */
.content{padding:0 16px;margin-top:-40px;position:relative;z-index:3;max-width:480px;margin-left:auto;margin-right:auto}

/* PROFILE CARD */
.profile-card{background:white;border-radius:20px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.1);margin-bottom:16px;display:flex;align-items:center;gap:14px}
.profile-avatar{width:56px;height:56px;border-radius:16px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.profile-info{flex:1}
.profile-name{font-size:16px;font-weight:800;color:var(--text)}
.profile-meta{font-size:12px;color:var(--text-3);margin-top:2px}
.profile-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px}
.status-present{background:var(--green-l);color:var(--green)}
.status-absent{background:var(--red-l);color:var(--red)}
.status-unknown{background:var(--surface);color:var(--text-3)}

/* QUICK STATS */
.quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.qstat{background:white;border-radius:14px;padding:14px;text-align:center}
.qstat-icon{font-size:22px;margin-bottom:6px}
.qstat-num{font-size:20px;font-weight:800;color:var(--text)}
.qstat-label{font-size:11px;color:var(--text-3);margin-top:2px}

/* SECTION CARDS */
.section-card{background:white;border-radius:16px;padding:18px;margin-bottom:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.section-action{font-size:12px;color:var(--blue);font-weight:600}

/* ATTENDANCE BARS */
.attend-week{display:flex;gap:6px;align-items:flex-end;height:60px;margin-bottom:8px}
.attend-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.attend-bar{width:100%;border-radius:4px 4px 0 0;transition:height 1s ease}
.attend-bar.present{background:var(--green)}
.attend-bar.absent{background:#F87171}
.attend-bar.future{background:var(--border)}
.attend-day-label{font-size:9px;color:var(--text-3)}

/* PLACEHOLDER SECTIONS */
.placeholder-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.placeholder-row:last-child{border-bottom:none}
.ph-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ph-text .t{font-size:13px;font-weight:600;color:var(--text)}
.ph-text .s{font-size:11px;color:var(--text-3);margin-top:1px}

.coming-soon{text-align:center;padding:20px;color:var(--text-3);font-size:12px}
.empty-feature{text-align:center;padding:24px 16px}
.empty-feature-ic{width:52px;height:52px;border-radius:14px;background:var(--surface);color:var(--text-3);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty-feature-t{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty-feature-s{font-size:12px;color:var(--text-3);line-height:1.5}
.hw-item{padding:12px 0;border-bottom:1px solid var(--border)}
.hw-item:last-child{border-bottom:none}
.hw-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hw-subject-pill{background:var(--purple-l);color:var(--purple);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px}
.hw-date{font-size:11px;color:var(--text-3)}
.hw-text{font-size:13px;color:var(--text);line-height:1.6}
.hw-audio{width:100%;margin-top:8px;height:36px}
.hw-img-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hw-img-thumb-view{width:70px;height:70px;border-radius:10px;object-fit:cover;border:1px solid var(--border);cursor:pointer}

.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-state h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text-2);line-height:1.6}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);display:flex;padding:8px 0;z-index:50}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer;color:var(--text-3)}
.bnav-item.active{color:var(--blue)}
.bnav-icon{font-size:18px}
.bnav-label{font-size:10px;font-weight:600}

.content{padding-bottom:80px}

@media(min-width:600px){
  .content{padding:0 24px;padding-bottom:24px;max-width:600px}
  .bottom-nav{display:none}
}

/* TIMELINE CARD - entry/exit */
.timeline-card{background:linear-gradient(135deg,#0F172A,#1A3570);border-radius:16px;padding:18px;margin-bottom:14px;color:white}
.timeline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.timeline-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.timeline-track{position:relative;padding:0 8px}
.timeline-line{position:absolute;top:18px;left:24px;right:24px;height:2px;background:rgba(255,255,255,.15)}
.timeline-points{display:flex;justify-content:space-between;position:relative}
.tpoint{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.tpoint-dot{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2}
.tpoint-dot.done{background:#10B981;border-color:#10B981}
.tpoint-time{font-size:11px;font-weight:700}
.tpoint-label{font-size:10px;color:rgba(255,255,255,.5)}

/* STREAK CARD */
.streak-card{background:linear-gradient(135deg,#F59E0B,#FBBF24);border-radius:16px;padding:18px;margin-bottom:14px;color:white;display:flex;align-items:center;gap:14px}
.streak-icon{font-size:36px}
.streak-num{font-size:24px;font-weight:900}
.streak-label{font-size:12px;opacity:.9}

/* ACHIEVEMENT BADGES */
.badge-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.badge-row::-webkit-scrollbar{display:none}
.badge-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px}
.badge-circle{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px}
.badge-locked{background:var(--surface);opacity:.4}
.badge-unlocked{background:linear-gradient(135deg,var(--blue-light),#DBEAFE)}
.badge-label{font-size:10px;color:var(--text-2);text-align:center;font-weight:600}

/* MONTHLY CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-header{font-size:9px;color:var(--text-3);text-align:center;font-weight:600;padding-bottom:4px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.cal-present{background:var(--green);color:white}
.cal-absent{background:#F87171;color:white}
.cal-empty{background:var(--surface);color:var(--text-3)}
.cal-future{background:transparent;color:var(--text-3)}

/* COMPARISON BAR */
.compare-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.compare-label{font-size:11px;color:var(--text-2);width:70px;flex-shrink:0}
.compare-track{flex:1;height:8px;background:var(--surface);border-radius:10px;overflow:hidden}
.compare-fill{height:100%;border-radius:10px;transition:width 1.2s ease}
.compare-val{font-size:11px;font-weight:700;color:var(--text);width:36px;text-align:right}

/* LIVE CLASS CARD */
.live-class-card{border-radius:16px;padding:18px;margin-bottom:14px}
.live-class-card.lc-now{background:linear-gradient(135deg,#064E3B,#065F46);color:white}
.live-class-card.lc-next{background:linear-gradient(135deg,#1E1B4B,#2D2A6B);color:white}
.live-class-card.lc-idle{background:white;border:1px solid var(--border)}
.lc-live-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:100px;background:rgba(52,211,153,.18);color:#34D399;border:1px solid rgba(52,211,153,.3);margin-bottom:10px;letter-spacing:.5px}
.lc-dot{width:6px;height:6px;border-radius:50%;background:#34D399;animation:pulse 1.5s infinite}
.lc-next-badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:100px;background:rgba(167,139,250,.2);color:#A78BFA;border:1px solid rgba(167,139,250,.3);margin-bottom:10px}
.lc-subject{font-size:20px;font-weight:900;margin-bottom:4px;line-height:1.2}
.lc-meta{font-size:12px;opacity:.7;margin-bottom:12px}
.lc-progress-track{height:5px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden;margin-bottom:8px}
.lc-progress-fill{height:100%;background:#34D399;border-radius:10px;transition:width .5s ease}
.lc-footer{font-size:12px;font-weight:700;opacity:.9}

/* ROUTINE LIST */
.routine-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.routine-item:last-child{border-bottom:none}
.routine-item.r-now{background:var(--green-l);margin:0 -18px;padding:11px 18px;border-radius:10px;border-bottom:none;margin-bottom:2px}
.routine-time-col{width:72px;flex-shrink:0}
.routine-time-start{font-size:12px;font-weight:700;color:var(--text)}
.routine-time-end{font-size:10.5px;color:var(--text-3)}
.routine-subj{font-size:13.5px;font-weight:700;color:var(--text)}
.routine-now-tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;background:var(--green);color:white;border-radius:100px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>

<div class="header">
  <div class="header-grid"></div>
  <div class="header-top">
    <div class="logo">Protisht<span>han</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="logout-btn" onclick="doLogout()">লগআউট</button>
      <button class="inbox-btn" onclick="openInbox()" aria-label="ইনবক্স">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg>
        <span class="inbox-dot" id="gInboxDot" style="display:none"></span>
      </button>
      <button class="inbox-btn" onclick="openNotifications()" aria-label="নোটিফিকেশন">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 3.5-1 5-2 6.5h16c-1-1.5-2-3-2-6.5z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
        <span class="inbox-dot" id="gNotifDot" style="display:none"></span>
      </button>
    </div>
  </div>
  <div class="greeting">
    <div class="greeting-sub" id="instNameHeader">প্রতিষ্ঠান</div>
    <h1 id="greetingText">স্বাগতম, অভিভাবক</h1>
    <div class="live-badge"><span class="live-dot"></span> তথ্য সরাসরি Live</div>
  </div>
  <div class="child-switcher" id="childSwitcher"></div>
</div>

<div class="content" id="mainContent">
  <!-- Filled dynamically -->
</div>

<div class="bottom-nav">
  <div class="bnav-item active" onclick="scrollToSection(null,this)"><span class="bnav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></span><span class="bnav-label">হোম</span></div>
  <div class="bnav-item" onclick="scrollToSection('sec-result',this)"><span class="bnav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M5 21V10M12 21V4M19 21v-7"/></svg></span><span class="bnav-label">ফলাফল</span></div>
  <div class="bnav-item" onclick="scrollToSection('sec-fee',this)"><span class="bnav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 9.5h19"/><path d="M6 14.5h4"/></svg></span><span class="bnav-label">ফি</span></div>
  <div class="bnav-item" onclick="scrollToSection('sec-routine',this)"><span class="bnav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/></svg></span><span class="bnav-label">রুটিন</span></div>
  <div class="bnav-item" onclick="scrollToSection('sec-homework',this)"><span class="bnav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 1 4 17.5v-13z"/></svg></span><span class="bnav-label">আজকের পড়া</span></div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://eoqeeuujvpydhmfteqqj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcWVldXVqdnB5ZGhtZnRlcXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTM2NTgsImV4cCI6MjA5NzE4OTY1OH0.xuC-_euxf0DTqTpD5b8_6vgnkjeJjZIFqdKw-Bq3YbU',
  { auth: { storageKey: 'prot-guardian' } }
);

let guardianStudents = [];
function toLocalDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
let activeStudentIndex = 0;

async function loadHomeworkForChild(){
  const wrap = document.getElementById('homeworkList');
  if(!wrap) return;
  const student = window.currentStudent;
  if(!student || !student.class_id){
    wrap.innerHTML = '<div class="empty-feature"><div class="empty-feature-t">হোমওয়ার্ক পাওয়া যায়নি</div></div>';
    return;
  }
  const { data, error } = await sb.from('homework').select('*')
    .eq('class_id', student.class_id)
    .order('created_at', {ascending:false}).limit(10);

  if(error || !data || !data.length){
    wrap.innerHTML = `<div class="empty-feature">
      <div class="empty-feature-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 1 4 17.5v-13z"/></svg></div>
      <div class="empty-feature-t">এখনো কোনো হোমওয়ার্ক দেওয়া হয়নি</div>
      <div class="empty-feature-s">শিক্ষক হোমওয়ার্ক দিলে এখানে দেখা যাবে</div>
    </div>`;
    return;
  }

  wrap.innerHTML = data.map(h=>`
    <div class="hw-item">
      <div class="hw-item-top">
        <span class="hw-subject-pill">${escapeHtmlG(h.subject||'বিষয়')}</span>
        <span class="hw-date">${h.date}</span>
      </div>
      ${h.text_content ? `<div class="hw-text">${escapeHtmlG(h.text_content)}</div>` : ''}
      ${h.voice_url ? vmsgHtml(h.voice_url, 'hw_'+h.id, 'light') : ''}
      ${(h.image_urls && h.image_urls.length) ? '<div class="hw-img-row">' + h.image_urls.map(u=>'<img src="'+u+'" class="hw-img-thumb-view" onclick="window.open(this.src)">').join('') + '</div>' : ''}
    </div>
  `).join('');
  initPendingVmsgPlayers();
}

function escapeHtmlG(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function scrollToSection(id, el){
  document.querySelectorAll('.bnav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  if(!id){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  const target = document.getElementById(id);
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}

function init(){
  const phone = localStorage.getItem('guardian_phone');
  if(!phone){ window.location.href='guardian-login.html'; return; }

  const stored = localStorage.getItem('guardian_students');
  if(!stored){ window.location.href='guardian-login.html'; return; }

  guardianStudents = JSON.parse(stored);
  if(guardianStudents.length === 0){
    window.location.href='guardian-login.html';
    return;
  }

  renderChildSwitcher();
  loadChildData(0);
}

function renderChildSwitcher(){
  const switcher = document.getElementById('childSwitcher');
  if(guardianStudents.length <= 1){
    switcher.style.display = 'none';
    return;
  }
  switcher.innerHTML = guardianStudents.map((g, i)=>{
    const s = g.students;
    const initial = (s.full_name||'?').slice(0,1);
    return `
    <div class="child-chip ${i===0?'active':''}" id="chip-${i}" data-index="${i}">
      <div class="child-chip-avatar">${initial}</div>
      <div class="child-chip-name">${s.full_name}</div>
    </div>`;
  }).join('');

  // event delegation — একবারই বাইন্ড হয়, re-render হলেও duplicate listener তৈরি হবে না
  if(!switcher.dataset.bound){
    switcher.addEventListener('click', (e)=>{
      const chip = e.target.closest('.child-chip');
      if(!chip) return;
      loadChildData(parseInt(chip.dataset.index));
    });
    switcher.dataset.bound = '1';
  }
}

let loadChildToken = 0;
async function loadChildData(index){
  activeStudentIndex = index;
  const myToken = ++loadChildToken; // stale request guard

  // Update chip active state
  document.querySelectorAll('.child-chip').forEach((c,i)=>{
    c.classList.toggle('active', i===index);
  });

  const guardianRecord = guardianStudents[index];
  const student = guardianRecord.students;
  const institution = student.institutions;
  window.currentStudent = student;
  subscribeNotifications();
  startInboxDotPolling();

  document.getElementById('instNameHeader').textContent = institution ? institution.name : 'প্রতিষ্ঠান';

  // Fetch attendance for this student
  const today = new Date();
  const weekAgo = new Date(today); weekAgo.setDate(today.getDate()-6);
  const { data: attendance } = await sb
    .from('attendance')
    .select('*')
    .eq('student_id', student.id)
    .gte('date', toLocalDateStr(weekAgo))
    .order('date', { ascending: true });

  if(myToken !== loadChildToken) return; // newer request already started, discard this stale one

  const todayStr = toLocalDateStr(today);
  const todayRecord = (attendance||[]).find(a=>a.date===todayStr);
  const presentCount = (attendance||[]).filter(a=>a.status==='present').length;
  const totalDays = (attendance||[]).length;

  renderContent(student, todayRecord, attendance||[], presentCount, totalDays);
  loadLiveClass(student);
  loadRoutine(student);
}

/* ── Live Class & Routine ── */
const BD_DAYS_G = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
function getBDNow(){ return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Dhaka'})); }
function toMinG(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmt12G(t){ const [h,m]=t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; }

// Cache: DB fetch every 30s, UI re-render every 3s
let _gSubjCache = null, _gSubjCacheTime = 0, _gSubjClassId = null;

async function loadLiveClass(student){
  const wrap = document.getElementById('liveClassWrap');
  if(!wrap || !student?.class_id) return;
  const nowMs = Date.now();
  if(!_gSubjCache || _gSubjClassId !== student.class_id || nowMs - _gSubjCacheTime > 30000){
    const { data } = await sb.from('class_subjects').select('*').eq('class_id', student.class_id);
    _gSubjCache = data || []; _gSubjCacheTime = nowMs; _gSubjClassId = student.class_id;
  }
  const subjects = _gSubjCache;
  const now = getBDNow();
  const todayKey = BD_DAYS_G[now.getDay()];
  const nowMin = now.getHours()*60 + now.getMinutes();
  const todays = (subjects||[])
    .filter(s => s.start_time && s.days_of_week && s.days_of_week.split(',').map(d=>d.trim()).includes(todayKey))
    .sort((a,b) => toMinG(a.start_time) - toMinG(b.start_time));
  let current=null, next=null;
  for(const s of todays){
    const st=toMinG(s.start_time), et=s.end_time?toMinG(s.end_time):st+45;
    if(nowMin>=st && nowMin<et){ current=s; break; }
    if(nowMin<st && !next) next=s;
  }
  if(current){
    const st=toMinG(current.start_time), et=current.end_time?toMinG(current.end_time):st+45;
    const rem=et-nowMin, pct=Math.round(((nowMin-st)/(et-st))*100);
    wrap.innerHTML=`<div class="live-class-card lc-now">
      <div class="lc-live-badge"><span class="lc-dot"></span> এখন চলছে</div>
      <div class="lc-subject">${current.subject_name}</div>
      <div class="lc-meta">${fmt12G(current.start_time)} — ${current.end_time?fmt12G(current.end_time):'?'}</div>
      <div class="lc-progress-track"><div class="lc-progress-fill" style="width:${pct}%"></div></div>
      <div class="lc-footer">⏱ ${rem} মিনিট বাকি</div>
    </div>`;
  } else if(next){
    const wait=toMinG(next.start_time)-nowMin;
    wrap.innerHTML=`<div class="live-class-card lc-next">
      <div class="lc-next-badge">পরবর্তী ক্লাস</div>
      <div class="lc-subject">${next.subject_name}</div>
      <div class="lc-meta">${fmt12G(next.start_time)} এ শুরু হবে</div>

function escHtmlGR(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderGuardianRoutine(){
  const wrap = document.getElementById('routineList');
  if(!wrap) return;
  const now = getBDNow();
  const todayLabel = BD_DAYS_G[now.getDay()]; // Bangla label for today
  const nowMin = now.getHours()*60+now.getMinutes();
  const subjects = _gSubjCache||[];

  const toggle = `<div style="display:flex;gap:6px;margin-bottom:12px">
    <button onclick="_ttgView='today';renderGuardianRoutine()" style="flex:1;padding:7px;border-radius:8px;border:1.5px solid ${_ttgView==='today'?'var(--blue)':'var(--border)'};background:${_ttgView==='today'?'var(--blue-light)':'white'};color:${_ttgView==='today'?'var(--blue)':'var(--text-3)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">আজকের ক্লাস</button>
    <button onclick="_ttgView='week';renderGuardianRoutine()" style="flex:1;padding:7px;border-radius:8px;border:1.5px solid ${_ttgView==='week'?'var(--blue)':'var(--border)'};background:${_ttgView==='week'?'var(--blue-light)':'white'};color:${_ttgView==='week'?'var(--blue)':'var(--text-3)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">সাপ্তাহিক</button>
  </div>`;

  if(_ttgView==='today'){
    const todays=subjects.filter(s=>s.start_time&&s.days_of_week&&s.days_of_week.split(',').map(d=>d.trim()).includes(todayLabel))
      .sort((a,b)=>toMinG(a.start_time)-toMinG(b.start_time));
    if(!todays.length){ wrap.innerHTML=toggle+`<div class="empty-feature"><div class="empty-feature-t">আজ কোনো ক্লাস নেই</div></div>`; return; }
    wrap.innerHTML=toggle+todays.map(s=>{
      const stMin=toMinG(s.start_time), etMin=s.end_time?toMinG(s.end_time):stMin+45;
      const isNow=nowMin>=stMin&&nowMin<etMin, isDone=nowMin>=etMin;
      return `<div class="routine-item${isNow?' r-now':''}">
        <div class="routine-time-col">
          <div class="routine-time-start" style="${isDone&&!isNow?'opacity:.4':''}">${fmt12G(s.start_time)}</div>
          ${s.end_time?`<div class="routine-time-end">${fmt12G(s.end_time)}</div>`:''}
        </div>
        <div style="${isDone&&!isNow?'opacity:.5':''}">
          <div class="routine-subj">${escHtmlGR(s.subject_name)}${isNow?'<span class="routine-now-tag">এখন</span>':isDone?'<span style="font-size:10px;color:var(--text-3);margin-left:6px">শেষ</span>':''}</div>
        </div>
      </div>`;
    }).join('');
  } else {
    // BD_DAYS_G = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'] — index matches JS getDay()
    // Display order: শনি(6),রবি(0),সোম(1),মঙ্গল(2),বুধ(3),বৃহঃ(4)
    const WIDX=[6,0,1,2,3,4], WLABELS=['শনি','রবি','সোম','মঙ্গল','বুধ','বৃহঃ'];
    const todayIdx=now.getDay();
    const timeSlots=[...new Set(subjects.filter(s=>s.start_time).map(s=>s.start_time))].sort();
    if(!timeSlots.length){ wrap.innerHTML=toggle+`<div class="empty-feature"><div class="empty-feature-t">সময়সূচী সেট করা হয়নি</div></div>`; return; }
    let tbl=`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:11px">
      <thead><tr><th style="background:var(--blue);color:white;padding:6px 5px;text-align:center">সময়</th>
      ${WIDX.map((di,wi)=>`<th style="background:${di===todayIdx?'#1044B0':'var(--blue)'};color:white;padding:6px 4px;text-align:center">${WLABELS[wi]}</th>`).join('')}
      </tr></thead><tbody>`;
    timeSlots.forEach((st,pi)=>{
      const stMin=toMinG(st), endT=subjects.find(s=>s.start_time===st)?.end_time;
      const etMin=endT?toMinG(endT):stMin+45, isNow=nowMin>=stMin&&nowMin<etMin;
      tbl+=`<tr${isNow?' style="outline:2px solid var(--green);outline-offset:-1px"':''}>
        <td style="background:var(--surface);text-align:center;padding:5px 6px;border:1px solid var(--border)">
          <span style="font-size:11px;font-weight:700;color:var(--blue)">${pi+1}</span>
          <div style="font-size:9px;color:var(--text-3)">${fmt12G(st)}</div>
        </td>`;
      WIDX.forEach((di,wi)=>{
        const dayLabel=BD_DAYS_G[di];
        const slot=subjects.find(s=>s.start_time===st&&s.days_of_week&&s.days_of_week.split(',').map(d=>d.trim()).includes(dayLabel));
        tbl+=`<td style="border:1px solid var(--border);padding:5px 3px;text-align:center;background:${di===todayIdx?'#EFF6FF':'white'}">${slot?`<span style="font-size:11px;font-weight:600;color:var(--blue)">${escHtmlGR(slot.subject_name)}</span>`:`<span style="color:var(--border)">—</span>`}</td>`;
      });
      tbl+=`</tr>`;
    });
    wrap.innerHTML=toggle+tbl+`</tbody></table></div>`;
  }
}

async function toggleThreadVoice(){
  const btn = document.getElementById('threadVoiceBtn');
  if(threadMediaRecorder && threadMediaRecorder.state === 'recording'){
    threadMediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    threadAudioChunks = [];
    threadMediaRecorder = new MediaRecorder(stream);

    threadAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = threadAudioCtx.createMediaStreamSource(stream);
    threadAnalyser = threadAudioCtx.createAnalyser();
    threadAnalyser.fftSize = 256;
    source.connect(threadAnalyser);

    document.getElementById('threadVoicePreview').style.display = 'none';
    document.getElementById('threadTextInput').style.display = 'none';
    document.getElementById('threadVoiceLiveWrap').style.display = 'flex';
    drawLiveThreadWaveform();

    threadMediaRecorder.ondataavailable = e => threadAudioChunks.push(e.data);
    threadMediaRecorder.onstop = async () => {
      threadAudioBlob = new Blob(threadAudioChunks, {type:'audio/webm'});
      stream.getTracks().forEach(t=>t.stop());
      cancelAnimationFrame(threadWaveAnimFrame);
      clearInterval(threadRecordTimerInterval);
      btn.classList.remove('recording');
      document.getElementById('threadVoiceLiveWrap').style.display = 'none';
      await prepareThreadPlayback();
    };

    threadMediaRecorder.start();
    btn.classList.add('recording');
    threadRecordStartTime = Date.now();
    threadRecordTimerInterval = setInterval(()=>{
      const sec = Math.floor((Date.now()-threadRecordStartTime)/1000);
      document.getElementById('threadVoiceTimerLive').textContent = Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
    }, 500);
  }catch(e){
    alert('মাইক্রোফোন অনুমতি দিতে হবে: ' + e.message);
  }
}

let threadAudioCtx = null, threadAnalyser = null, threadWaveAnimFrame = null;
let threadRecordStartTime = 0, threadRecordTimerInterval = null;
let threadAudioPeaks = [];
let threadPlaybackAudio = null;
let threadPlaybackAnimFrame = null;
let threadWaveHistory = [];

function fitThreadCanvas(canvas){
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(40, Math.floor(rect.width));
  const h = Math.max(20, Math.floor(rect.height || 30));
  if(canvas.width !== w) canvas.width = w;
  if(canvas.height !== h) canvas.height = h;
}

function drawLiveThreadWaveform(){
  const canvas = document.getElementById('threadWaveCanvas');
  fitThreadCanvas(canvas);
  const ctx = canvas.getContext('2d');
  const dataArr = new Uint8Array(threadAnalyser.fftSize);
  threadWaveHistory = [];
  let smoothedLevel = 0;
  function draw(){
    threadWaveAnimFrame = requestAnimationFrame(draw);
    threadAnalyser.getByteTimeDomainData(dataArr);
    let sumSq = 0;
    for(let i=0;i<dataArr.length;i++){ const v=(dataArr[i]-128)/128; sumSq += v*v; }
    const rms = Math.sqrt(sumSq/dataArr.length);
    smoothedLevel = smoothedLevel*0.7 + rms*0.3;
    const level = Math.min(1, smoothedLevel*4);
    const barW = 3, gap = 2;
    const maxBars = Math.floor(canvas.width/(barW+gap));
    threadWaveHistory.push(level);
    if(threadWaveHistory.length > maxBars) threadWaveHistory.shift();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#7C3AED';
    const startX = canvas.width - threadWaveHistory.length*(barW+gap);
    threadWaveHistory.forEach((lvl,i)=>{
      const h = Math.max(3, lvl*canvas.height*0.85);
      const x = startX + i*(barW+gap);
      ctx.fillRect(x, (canvas.height-h)/2, barW, h);
    });
  }
  draw();
}

async function prepareThreadPlayback(){
  const arrBuf = await threadAudioBlob.arrayBuffer();
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let audioBuffer;
  try{ audioBuffer = await audioCtx.decodeAudioData(arrBuf); }
  catch(e){ audioBuffer = null; }
  if(audioBuffer){
    const raw = audioBuffer.getChannelData(0);
    const barCount = 28, blockSize = Math.floor(raw.length/barCount);
    threadAudioPeaks = [];
    for(let i=0;i<barCount;i++){
      let sum = 0;
      for(let j=0;j<blockSize;j++) sum += Math.abs(raw[i*blockSize+j] || 0);
      threadAudioPeaks.push(sum/blockSize);
    }
    const max = Math.max(...threadAudioPeaks, 0.01);
    threadAudioPeaks = threadAudioPeaks.map(p=>p/max);
  } else {
    threadAudioPeaks = Array.from({length:28}, ()=>0.3+Math.random()*0.5);
  }
  threadPlaybackAudio = new Audio(URL.createObjectURL(threadAudioBlob));
  document.getElementById('threadVoicePreview').style.display = 'flex';
  drawStaticThreadWaveform(0);
  threadPlaybackAudio.onended = ()=>{
    document.getElementById('threadVoicePlayBtn').textContent = '▶';
    drawStaticThreadWaveform(0);
  };
}

function drawStaticThreadWaveform(progress){
  const canvas = document.getElementById('threadWaveCanvasPreview');
  fitThreadCanvas(canvas);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const barCount = threadAudioPeaks.length;
  const barW = canvas.width/barCount;
  threadAudioPeaks.forEach((p,i)=>{
    const h = Math.max(3, Math.min(canvas.height*0.85, p*canvas.height*0.85));
    ctx.fillStyle = (i/barCount <= progress) ? '#7C3AED' : '#C4B5FD';
    ctx.fillRect(i*barW, (canvas.height-h)/2, Math.max(1,barW-2), h);
  });
}

function toggleThreadVoicePlayback(){
  const playBtn = document.getElementById('threadVoicePlayBtn');
  if(!threadPlaybackAudio) return;
  if(threadPlaybackAudio.paused){
    threadPlaybackAudio.play();
    playBtn.textContent = '❙❙';
    const animate = ()=>{
      if(threadPlaybackAudio.paused) return;
      drawStaticThreadWaveform(threadPlaybackAudio.currentTime / (threadPlaybackAudio.duration||1));
      threadPlaybackAnimFrame = requestAnimationFrame(animate);
    };
    animate();
  } else {
    threadPlaybackAudio.pause();
    playBtn.textContent = '▶';
    cancelAnimationFrame(threadPlaybackAnimFrame);
  }
}

function discardThreadVoice(){
  threadAudioBlob = null;
  threadAudioPeaks = [];
  if(threadPlaybackAudio){ threadPlaybackAudio.pause(); threadPlaybackAudio = null; }
  document.getElementById('threadVoicePreview').style.display = 'none';

}

async function sendThreadVoiceMessage(){
  if(!threadAudioBlob) return;
    const s2 = window.currentStudent;
  const fileName = `chat/${s2.id}_${Date.now()}.webm`;

  if(upErr){ alert('ভয়েস পাঠানো যায়নি: ' + upErr.message); return; }
  const { data: pub } = sb.storage.from('voice-notes').getPublicUrl(fileName);

    receiver_type: 'teacher', receiver_id: currentThreadTeacher,
    type: 'voice', voice_url: pub.publicUrl
  });
  discardThreadVoice();
  // realtime will append the voice message automatically
}


let vmsgAudios = {};
let vmsgThemes = {};
function vmsgHtml(url, id, theme){
  vmsgThemes[id] = theme || 'light';
  vmsgPending.push({id, url});
  return `<div class="vmsg-player">
    <button class="vmsg-play" id="vmsgPlay_${id}" onclick="vmsgToggle('${id}','${url}')">&#9654;</button>
    <canvas class="vmsg-canvas" id="vmsgCanvas_${id}"></canvas>
    <span class="vmsg-time" id="vmsgTime_${id}">0:00</span>
  </div>`;
}
let vmsgPending = [];
function initPendingVmsgPlayers(){
  const list = vmsgPending.slice();
  vmsgPending = [];
  list.forEach(({id,url})=>{ vmsgEnsureLoaded(id, url); });
}
async function vmsgEnsureLoaded(id, url){
  if(vmsgAudios[id]) return vmsgAudios[id];
  const audio = new Audio(url);
  let peaks = Array.from({length:24},(_,i)=>0.45+0.4*Math.sin(i*0.8));
  vmsgAudios[id] = { audio, peaks };
  drawVmsgWave(id, 0);
  try{
    const resp = await fetch(url);
    const buf = await resp.arrayBuffer();
    const actx = new (window.AudioContext||window.webkitAudioContext)();
    const decoded = await actx.decodeAudioData(buf);
    const raw = decoded.getChannelData(0);
    const barCount = 24, block = Math.floor(raw.length/barCount);
    let p = [];
    for(let i=0;i<barCount;i++){ let s=0; for(let j=0;j<block;j++) s+=Math.abs(raw[i*block+j]||0); p.push(s/block); }
    const max = Math.max(...p, 0.01);
    vmsgAudios[id].peaks = p.map(v=>v/max);
    drawVmsgWave(id, 0);
  }catch(e){}
  audio.onended = ()=>{ const b=document.getElementById('vmsgPlay_'+id); if(b) b.innerHTML='&#9654;'; drawVmsgWave(id,0); };
  return vmsgAudios[id];
}
function smoothPeaks(arr){
  // light moving-average smoothing for a cleaner, flowing look
  const out = [];
  for(let i=0;i<arr.length;i++){
    const a = arr[Math.max(0,i-1)], b = arr[i], c = arr[Math.min(arr.length-1,i+1)];
    out.push((a+b*2+c)/4);
  }
  const max = Math.max(...out, 0.05);
  return out.map(v=>Math.max(0.18, v/max)); // floor so bars never look "dead"
}
function drawVmsgWave(id, progress){
  const canvas = document.getElementById('vmsgCanvas_'+id);
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cssW = Math.max(60, Math.floor(rect.width));
  const cssH = Math.max(20, Math.floor(rect.height || 26));
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const rawPeaks = (vmsgAudios[id] && vmsgAudios[id].peaks) || [];
  const peaks = smoothPeaks(rawPeaks);
  const theme = vmsgThemes[id] || 'light';
  const gap = 2.5;
  const barW = (cssW/peaks.length) - gap;
  peaks.forEach((p,i)=>{
    const h = Math.max(3, Math.min(cssH*0.8, p*cssH*0.8));
    const played = (i/peaks.length) <= progress;
    ctx.fillStyle = theme==='dark' ? (played?'#fff':'rgba(255,255,255,.42)') : (played?'#7C3AED':'#C9B8F5');
    const x = i*(barW+gap), y = (cssH-h)/2, r = Math.min(barW,h)/2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,barW,h,r); else ctx.rect(x,y,barW,h);
    ctx.fill();
  });
}
function vmsgFmtTime(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
async function vmsgToggle(id, url){
  const rec = await vmsgEnsureLoaded(id, url);
  const btn = document.getElementById('vmsgPlay_'+id);
  if(rec.audio.paused){
    rec.audio.play();
    if(btn) btn.innerHTML = '&#10074;&#10074;';
    const anim = ()=>{
      if(rec.audio.paused) return;
      drawVmsgWave(id, rec.audio.currentTime/(rec.audio.duration||1));
      const t = document.getElementById('vmsgTime_'+id);
      if(t) t.textContent = vmsgFmtTime(rec.audio.currentTime);
      requestAnimationFrame(anim);
    };
    anim();
  } else {
    rec.audio.pause();
    if(btn) btn.innerHTML = '&#9654;';
  }
}

init();

setInterval(() => {
  const s = window.currentStudent;
  if(s){ loadLiveClass(s); loadRoutine(s); }
}, 3000);

<script>
// ── AUDIO CALL (Guardian) ──
let gCall = { state:'idle', pc:null, localStream:null, seconds:0, timer:null, ringtone:null, isMuted:false, callChannel:null };

const G_ICE = { iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject'}
]};
const G_AUDIO = { audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }, video:false };
let gRemoteAudio = null;
function gSetupRemoteAudio(stream){
  if(!gRemoteAudio){ gRemoteAudio = new Audio(); gRemoteAudio.autoplay=true; document.body.appendChild(gRemoteAudio); }
  gRemoteAudio.srcObject = stream;
  gRemoteAudio.play().catch(()=>{});
}

function gInitials(n){ return (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function gFmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

// subscribe to incoming calls — guardian uses student ID as channel key
function gSubscribeCall(){
  // wait until currentStudent is loaded
  const trySubscribe = ()=>{
    const student = window.currentStudent;
    if(!student?.id){ setTimeout(trySubscribe, 500); return; }
    gCall.callChannel = sb.channel('gcalls_guardian_'+student.id)
      .on('broadcast',{event:'call_offer'},({payload})=>gHandleIncoming(payload))
      .on('broadcast',{event:'call_answer'},({payload})=>gHandleAnswer(payload))
      .on('broadcast',{event:'call_ice'},({payload})=>gHandleIce(payload))
      .on('broadcast',{event:'call_end'},()=>gRemoteEnd())
      .on('broadcast',{event:'call_reject'},()=>gHandleReject())
      .subscribe();
  };
  trySubscribe();
}
gSubscribeCall();

async function startAudioCall(){
  if(gCall.state!=='idle') return;
  if(!currentThreadTeacher) return;
  const student = window.currentStudent;
  if(!student?.id) return;

  gCall.state='calling';
  gCall.targetId = currentThreadTeacher; // teacher's record id used as channel key
  gShowOverlay('outgoing', currentThreadTeacherName);

  try{
    gCall.localStream = await navigator.mediaDevices.getUserMedia(G_AUDIO);
    gCall.pc = new RTCPeerConnection(G_ICE);
    gCall.localStream.getTracks().forEach(t=>gCall.pc.addTrack(t,gCall.localStream));
    gCall.pc.ontrack = e=>{ if(e.streams[0]) gSetupRemoteAudio(e.streams[0]); };
    gCall.pc.onicecandidate = e=>{ if(e.candidate) gBroadcast('teacher_'+currentThreadTeacher,'call_ice',{candidate:e.candidate}); };
    gCall.pc.onconnectionstatechange = ()=>{
      if(gCall.pc?.connectionState==='connected'){ gStartTimer(); gUpdateOverlay('active'); }
      if(['disconnected','failed','closed'].includes(gCall.pc?.connectionState)) gEndLocal();
    };
    const offer = await gCall.pc.createOffer();
    await gCall.pc.setLocalDescription(offer);
    // from = guardian identified by studentId
    gBroadcast('teacher_'+currentThreadTeacher,'call_offer',{
      offer,
      from: 'guardian_'+student.id,
      fromName: student.guardian_name || 'অভিভাবক',
      fromRole: 'guardian',
      studentId: student.id
    });
  } catch(e){
    gCall.state='idle'; gHideOverlay();
    alert('মাইক্রোফোনের অনুমতি দিন।');
  }
}

function gHandleIncoming(data){
  if(gCall.state!=='idle') return;
  gCall.state='incoming'; gCall.incomingData=data;
  gShowOverlay('incoming', data.fromName||'শিক্ষক');
  gPlayRing();
}

async function gAcceptCall(){
  gStopRing();
  const data = gCall.incomingData; if(!data) return;
  gCall.state='active'; gUpdateOverlay('active');
  try{
    gCall.localStream = await navigator.mediaDevices.getUserMedia(G_AUDIO);
    gCall.pc = new RTCPeerConnection(G_ICE);
    gCall.localStream.getTracks().forEach(t=>gCall.pc.addTrack(t,gCall.localStream));
    gCall.pc.ontrack = e=>{ if(e.streams[0]) gSetupRemoteAudio(e.streams[0]); };
    gCall.pc.onicecandidate = e=>{ if(e.candidate) gBroadcast(data.from,'call_ice',{candidate:e.candidate}); };
    gCall.pc.onconnectionstatechange = ()=>{
      if(gCall.pc?.connectionState==='connected') gStartTimer();
      if(['disconnected','failed','closed'].includes(gCall.pc?.connectionState)) gEndLocal();
    };
    await gCall.pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await gCall.pc.createAnswer();
    await gCall.pc.setLocalDescription(answer);
    gBroadcast(data.from,'call_answer',{ answer, from:'guardian_'+window.currentStudent?.id });
  } catch(e){ gEndLocal(); alert('মাইক্রোফোনের অনুমতি দিন।'); }
}

async function gHandleAnswer(data){
  if(!gCall.pc||gCall.state!=='calling') return;
  await gCall.pc.setRemoteDescription(new RTCSessionDescription(data.answer));
  gCall.state='active'; gUpdateOverlay('active');
}

async function gHandleIce(data){
  try{ if(gCall.pc) await gCall.pc.addIceCandidate(new RTCIceCandidate(data.candidate)); }catch{}
}

function gRejectCall(){
  gStopRing();
  if(gCall.incomingData) gBroadcast(gCall.incomingData.from,'call_reject',{});
  gCall.state='idle'; gCall.incomingData=null; gHideOverlay();
}

function gHandleReject(){ gEndLocal(); }
function gRemoteEnd(){ gEndLocal(); }

function gEndCall(){
  // channel keys use prefix: 'teacher_<id>' or 'guardian_<studentId>'
  const target = gCall.incomingData?.from || ('teacher_'+currentThreadTeacher);
  if(target) gBroadcast(target,'call_end',{});
  gEndLocal();
}

function gEndLocal(){
  gStopRing(); gStopTimer();
  if(gCall.pc){ try{gCall.pc.close();}catch{} gCall.pc=null; }
  if(gCall.localStream){ gCall.localStream.getTracks().forEach(t=>t.stop()); gCall.localStream=null; }
  gCall.state='idle'; gCall.incomingData=null; gCall.isMuted=false;
  gHideOverlay();
}

function gToggleMute(){
  gCall.isMuted=!gCall.isMuted;
  gCall.localStream?.getAudioTracks().forEach(t=>t.enabled=!gCall.isMuted);
  const btn=document.getElementById('gMuteBtn');
  if(btn){ btn.style.background=gCall.isMuted?'rgba(220,38,38,.4)':'rgba(255,255,255,.15)'; btn.title=gCall.isMuted?'আনমিউট':'মিউট'; }
}

// Subscribe to peer's channel so we can broadcast to them
let gPeerChannel = null;
function gSubscribePeerChannel(peerKey){
  if(gPeerChannel) sb.removeChannel(gPeerChannel);
  gPeerChannel = sb.channel('gcalls_'+peerKey);
  gPeerChannel.subscribe();
}

function gBroadcast(channelKey, event, payload){
  const ch = gPeerChannel && gPeerChannel.topic === 'realtime:gcalls_'+channelKey
    ? gPeerChannel
    : (() => { const c = sb.channel('gcalls_'+channelKey); c.subscribe(); return c; })();
  ch.send({type:'broadcast', event, payload});
}

function gHideOverlay(){ document.getElementById('gCallOverlay').style.display='none'; }

// ── TIMER ──
function gStartTimer(){
  gCall.seconds=0;
  gCall.timer=setInterval(()=>{ gCall.seconds++; const el=document.getElementById('gCallTimer'); if(el) el.textContent=gFmt(gCall.seconds); },1000);
}
function gStopTimer(){ clearInterval(gCall.timer); gCall.seconds=0; const el=document.getElementById('gCallTimer'); if(el) el.textContent='00:00'; }

// ── RINGTONE ──
let gRingCtx=null, gRingNodes=[];
function gPlayRing(){
  try{
    gRingCtx=new AudioContext();
    function beep(){ const o=gRingCtx.createOscillator(),g=gRingCtx.createGain(); o.connect(g); g.connect(gRingCtx.destination); o.frequency.value=880; g.gain.setValueAtTime(.3,gRingCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,gRingCtx.currentTime+.4); o.start(); o.stop(gRingCtx.currentTime+.4); gRingNodes.push(o); }
    beep(); gRingNodes.push(setInterval(()=>{ if(gCall.state==='incoming') beep(); else gStopRing(); },1500));
  }catch{}
}
function gStopRing(){ gRingNodes.forEach(n=>{ try{n.stop?.();clearInterval(n);}catch{} }); gRingNodes=[]; try{gRingCtx?.close();}catch{} gRingCtx=null; }
</script>
