<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কনটেন্ট স্টুডিও — Protishthan</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F7FB;--panel:#fff;--panel-2:#F8FAFD;--text:#0B1220;--muted:#5B6B82;--faint:#94A3B8;--line:#E4E9F2;--line-2:#D5DDEB;
  --brand:#1A56DB;--brand-2:#4F46E5;--brand-soft:#EAF0FF;--side:#0B1633;--side-2:#12204A;
  --k-text:#2563EB;--k-text-s:#E8F0FF;--k-card:#D97706;--k-card-s:#FFF4DE;--k-reel:#7C3AED;--k-reel-s:#F1EAFF;--k-series:#0E9F6E;--k-series-s:#E2F7EE;
  --ok:#059669;--ok-s:#E4F8EF;--bad:#DC2626;--bad-s:#FEECEC;--warn:#D97706;--warn-s:#FFF4DE;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);--sh-lg:0 24px 60px -12px rgba(11,18,32,.35);--r:14px;
}
:root[data-theme=dark]{
  --bg:#0A0F1F;--panel:#10172E;--panel-2:#0D1428;--text:#E8EDF8;--muted:#98A5BF;--faint:#64718C;--line:#1E2846;--line-2:#2A3558;
  --brand:#5B8DEF;--brand-soft:#16264F;--side:#070C1A;--side-2:#101A38;
  --k-text:#6EA0FF;--k-text-s:#14234A;--k-card:#F5B54A;--k-card-s:#3A2B12;--k-reel:#B79CFF;--k-reel-s:#26194A;--k-series:#34D399;--k-series-s:#0F2C24;
  --ok:#34D399;--ok-s:#0F2C24;--bad:#F87171;--bad-s:#361517;--warn:#F5B54A;--warn-s:#3A2B12;
  --sh:0 1px 2px rgba(0,0,0,.4);--sh-lg:0 24px 60px -12px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.num{font-family:'Inter','Hind Siliguri',sans-serif;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg{flex:none;display:block}

/* ---------- gate ---------- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 500px at 80% -10%,rgba(79,70,229,.45),transparent 60%),linear-gradient(170deg,#070C1A,#0B1633 60%,#14295E)}
.gbox{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:var(--sh-lg)}
.logo-tile{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;overflow:hidden;background:linear-gradient(135deg,#1A56DB,#4F46E5)}.logo-tile img{width:100%;height:100%;display:block}
.gbox h1{font-size:22px;font-weight:700;letter-spacing:-.2px}.gbox p{color:var(--muted);font-size:14.5px;margin:6px 0 18px}
.gbox input{width:100%;height:50px;border:1.5px solid var(--line-2);border-radius:13px;padding:0 14px;font:600 16px 'Inter',sans-serif;letter-spacing:.6px;text-align:center;background:var(--panel-2)}
.gbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.gbox em{display:block;min-height:20px;margin-top:10px;font-style:normal;color:var(--bad);font-size:13.5px}

/* ---------- buttons, chips, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line-2);font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--panel-2);border-color:var(--faint)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line-2))}.btn.danger:hover{background:var(--bad-s)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}.btn.icon{width:38px;padding:0}.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.45;pointer-events:none}
.gbox .btn{width:100%;height:50px;margin-top:12px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px 2px 7px;line-height:1.5;white-space:nowrap}
.chip svg{width:13px;height:13px}
.c-text{color:var(--k-text);background:var(--k-text-s)}.c-card{color:var(--k-card);background:var(--k-card-s)}.c-reel{color:var(--k-reel);background:var(--k-reel-s)}.c-series{color:var(--k-series);background:var(--k-series-s)}
.s-ok{color:var(--ok);background:var(--ok-s)}.s-q{color:var(--brand);background:var(--brand-soft)}.s-w{color:var(--warn);background:var(--warn-s)}.s-bad{color:var(--bad);background:var(--bad-s)}.s-n{color:var(--muted);background:var(--panel-2);border:1px solid var(--line)}
.inp{width:100%;height:40px;border:1px solid var(--line-2);border-radius:11px;padding:0 12px;background:var(--panel);font-size:14.5px}
textarea.inp{height:auto;min-height:150px;padding:10px 12px;line-height:1.6;resize:vertical}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--sh)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--side),var(--side-2));color:#fff;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}.brand .logo-tile{margin:0;width:38px;height:38px;border-radius:11px}
.brand b{display:block;font-size:15.5px;letter-spacing:-.1px;line-height:1.2}.brand span{font-size:11.5px;opacity:.55}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:11px;color:rgba(255,255,255,.68);font-weight:500;font-size:15px;text-align:left;position:relative;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(91,141,239,.2);color:#fff;font-weight:600}
.nav button.on::before{content:'';position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#7FA6FF}
.nav .badge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#EF4444;color:#fff;font:700 11.5px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:0 6px}
.side .grow{flex:1}
.side .foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.side .foot button{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;color:rgba(255,255,255,.65);font-size:14px}
.side .foot button:hover{background:rgba(255,255,255,.07);color:#fff}
.live{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;font-size:12.5px;color:rgba(255,255,255,.6)}
.live i{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}.live.off i{background:#F59E0B;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
.bar h1{font-size:20px;font-weight:700;letter-spacing:-.2px;line-height:1.2}.bar small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.bar .ttl{flex:1;min-width:0}
.search{position:relative;width:min(300px,34vw)}.search svg{position:absolute;left:11px;top:11px;color:var(--faint)}.search .inp{padding-left:36px}
.wrap{padding:22px 24px 90px;max-width:1280px;width:100%;margin:0 auto}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.card .hd{display:flex;align-items:center;gap:10px;padding:15px 18px 0}.card .hd h3{font-size:15px;font-weight:600;flex:1}.card .hd small{color:var(--muted);font-size:12.5px}
.card .bd{padding:14px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}.kpi h4{font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .v{font:700 30px/1.15 'Inter','Hind Siliguri',sans-serif;letter-spacing:-.8px;margin-top:6px}.kpi .v small{font-size:14px;color:var(--faint);font-weight:600;letter-spacing:0}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ring{position:absolute;right:14px;top:14px}
.mini{display:flex;flex-direction:column;gap:8px;margin-top:8px}.mini div{display:grid;grid-template-columns:46px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.meter{height:7px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}.meter b{display:block;height:100%;border-radius:4px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;cursor:pointer;text-align:left;width:100%}.row:hover{background:var(--panel-2)}
.row+.row{border-top:1px solid var(--line)}
.th{width:44px;height:55px;border-radius:9px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.row .m{min-width:0;flex:1}.row .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.empty-state{border:1.5px dashed var(--line-2);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty-state b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}

/* ---------- calendar ---------- */
.tool{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tool .grow{flex:1}.tool h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh)}
.wkg{display:grid;grid-template-columns:70px repeat(7,minmax(128px,1fr));min-width:960px}
.wkg .h{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:13px;color:var(--muted);cursor:pointer}
.wkg .h b{display:block;font:700 18px 'Inter',sans-serif;color:var(--text);line-height:1.2}.wkg .h.today b{color:var(--brand)}.wkg .h.today{background:var(--brand-soft)}
.wkg .hr{padding:8px 8px 0;text-align:right;font-size:12px;color:var(--faint);border-top:1px solid var(--line);min-height:62px}
.wkg .c{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;min-height:62px;position:relative}
.wkg .c.past{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 40%,transparent) 8px 9px)}
.wkg .c.drop,.day [data-cell].drop{background:var(--brand-soft);outline:2px dashed var(--brand);outline-offset:-3px;border-radius:12px}
.wkg .c.nowrow{box-shadow:inset 0 2px 0 var(--brand)}
.add{width:100%;height:100%;min-height:52px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--faint);opacity:0;transition:opacity .12s,background .12s;font-size:12px;gap:4px}
.c:hover .add,.add:focus-visible{opacity:1;background:var(--panel-2)}.c.past .add{display:none}
.slotchip{display:flex;align-items:center;gap:7px;width:100%;height:100%;min-height:52px;padding:5px 5px 5px 9px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);text-align:left;position:relative;cursor:pointer;overflow:hidden}
.slotchip:hover{border-color:var(--brand);box-shadow:var(--sh)}.slotchip[draggable=true]{cursor:grab}.slotchip.dim{opacity:.3}
.slotchip::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.slotchip.k-text::before{background:var(--k-text)}.slotchip.k-card::before{background:var(--k-card)}.slotchip.k-reel::before{background:var(--k-reel)}.slotchip.k-series::before{background:var(--k-series)}
.slotchip .th{width:28px;height:35px;border-radius:6px}.slotchip .t{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;min-width:0}
.slotchip .st{position:absolute;right:4px;top:4px;width:16px;height:16px}.slotchip .st svg{width:14px;height:14px}.st.ok{color:var(--ok)}.st.q{color:var(--brand)}.st.bad{color:var(--bad)}.st.w{color:var(--warn)}
.day .slot{display:grid;grid-template-columns:86px 1fr;gap:12px;margin-bottom:8px}.day .slot .tm{font-size:13px;font-weight:600;color:var(--muted);text-align:right;padding-top:14px}
.day .slot.now .tm{color:var(--brand)}
.tile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:9px;border-radius:13px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;margin-bottom:6px}
.tile:hover{border-color:var(--brand)}.tile .th{width:54px;height:68px}.tile .m{min-width:0;flex:1}.tile .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.tile.dim{opacity:.35}
.slotempty{width:100%;min-height:58px;border:1.5px dashed var(--line-2);border-radius:13px;color:var(--faint);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px;transition:border-color .15s,color .15s,background .15s}
.slotempty:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}.slotempty[disabled]{cursor:default;pointer-events:none;opacity:.7}
.mon{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.mon .dn{font-size:12.5px;color:var(--muted);text-align:center;padding:4px}
.md{min-height:92px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.md:hover{border-color:var(--brand)}.md.dim{opacity:.4}.md.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.md b{font:700 14px 'Inter',sans-serif}.md .seg3{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel-2);gap:1px}.md .seg3 i{display:block;height:100%}
.md small{font-size:11.5px;color:var(--muted)}

/* ---------- library ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sc{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;cursor:pointer}
.sc:hover{border-color:var(--brand)}.sc.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.sc .im{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.sc .bd2{padding:9px 11px 11px}.sc .t{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.sc .meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.sc .ck{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.92);border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .12s}
.sc:hover .ck,.selmode .sc .ck,.sc.sel .ck{opacity:1}.sc.sel .ck{background:var(--brand);border-color:var(--brand)}
.sc .ord{position:absolute;right:8px;top:8px;font:700 11.5px 'Inter',sans-serif;background:rgba(11,22,51,.78);color:#fff;border-radius:7px;padding:1px 7px}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:30;background:var(--side);color:#fff;border-radius:16px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-lg);max-width:calc(100vw - 24px)}
.bulk b{font-size:14px;margin-right:6px;white-space:nowrap}.bulk .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}.bulk .btn:hover{background:rgba(255,255,255,.18)}.bulk .btn.danger{color:#FCA5A5}

/* ---------- overlays ---------- */
.back{position:fixed;inset:0;background:rgba(7,12,26,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.back.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--panel);z-index:61;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-lg);border-left:1px solid var(--line)}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.drawer .dh h2{font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .db{flex:1;overflow:auto;padding:16px}.drawer .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--panel-2)}
.pv{border-radius:14px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;max-height:340px}
.pv img{max-width:100%;max-height:340px;display:block;object-fit:contain}.pv .ph{height:200px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.fld{margin-top:16px}.fld label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.steps{display:flex;align-items:center;gap:6px;margin:14px 0 2px;font-size:12px;color:var(--faint)}.steps i{flex:1;height:2px;background:var(--line-2);border-radius:1px}.steps i.on{background:var(--brand)}.steps span.on{color:var(--brand);font-weight:700}
.notice{margin-top:14px;padding:11px 13px;border-radius:12px;font-size:13.5px}.notice.bad{background:var(--bad-s);color:var(--bad)}.notice.ok{background:var(--ok-s);color:var(--ok)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:min(720px,calc(100vw - 24px));max-height:88vh;background:var(--panel);border-radius:20px;z-index:62;box-shadow:var(--sh-lg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line)}.modal .mh h2{font-size:17px}.modal .mh p{font-size:13px;color:var(--muted)}
.modal .mb{padding:16px 18px;overflow:auto}.modal.sm{width:min(420px,calc(100vw - 24px))}.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);

const pad = (n) => String(n).padStart(2, '0');

const ymdAdd = (ymd, n) => { const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

const ERR = { slot_taken: 'এই সময়ের ২০ মিনিটের মধ্যে আরেকটা পোস্ট আছে।', time_too_soon: 'সময় অন্তত ২ মিনিট পরের হতে হবে।', time_too_far: 'এত দূরের সময় দেওয়া যায় না।', 'bad time': 'সময়টা বোঝা যায়নি।' };

function vCalendar() {

  const cap = $('dCap'), ttl = $('dTitle'), com = $('dCom'), save = $('dSave'), cnt = () => { $('dCnt').textContent = bn(cap.value.length) + ' / ৪০০০'; if (save) save.disabled = cap.value === (x.caption || '') && ttl.value === (x.title || '') && com.value === (x.first_comment || ''); }; cnt(); cap.oninput = cnt; ttl.oninput = cnt; com.oninput = cnt;
  $('dClose').onclick = closeDrawer;
  if (save) save.onclick = async () => { if (await act(() => api('update', { id, title: ttl.value, caption: cap.value, first_comment: com.value }), 'সেভ হয়েছে')) { if (byId(id)) openDrawer(id); } };
  if ($('dtSave')) $('dtSave').onclick = async () => { const v = $('dt').value; if (!v) return toast('সময় বেছে নিন', 'bad'); if (await act(() => api('schedule', { id, scheduled_at: fromLocalInput(v) }), 'সময় ঠিক হয়েছে')) openDrawer(id); };
  if ($('dNow')) $('dNow').onclick = async () => { if (await ask('এখনই পোস্ট করবেন?', 'আনুমানিক ২–৩ মিনিটের মধ্যে পেজে চলে যাবে।', 'হ্যাঁ, পোস্ট করুন')) { if (await act(() => api('schedule', { id, scheduled_at: new Date(Date.now() + 3 * 60000).toISOString() }), 'কয়েক মিনিটের মধ্যে পোস্ট হবে')) openDrawer(id); } };
  if ($('dStock')) $('dStock').onclick = async () => { if (await act(() => api('unschedule', { ids: [id] }), 'স্টকে ফেরানো হয়েছে')) openDrawer(id); };
  if ($('dDel')) $('dDel').onclick = async () => { if (await ask('মুছে ফেলবেন?', 'এই কার্ড আর ফেরত পাওয়া যাবে না।', 'মুছুন', true)) { if (await act(() => api('delete', { ids: [id] }), 'মুছে ফেলা হয়েছে')) closeDrawer(); } };
}
function closeDrawer() { OPEN_ID = null; $('drawer').classList.remove('on'); if (!$('modal').classList.contains('on')) $('back').classList.remove('on'); }

// ---------- slot picker ----------
function openPicker(ymd, h) {
  const kind = slotKind(ymd, h), all = DATA.items.filter((x) => x.status === 'stock'); let pk = kind, q = '';
  const m = $('modal'); m.className = 'modal on';
  const draw = () => { const list = all.filter((x) => (pk === 'all' || x.kind === pk) && (!q || ((x.title || '') + ' ' + (x.caption || '')).toLowerCase().includes(q)));
    $('pkg').innerHTML = list.length ? '<div class="grid">' + list.map((x) => '<button class="sc" type="button" data-use="' + esc(x.id) + '">' + (x.thumb ? '<img class="im" src="' + esc(x.thumb) + '" alt="" loading="lazy">' : '<div class="im">' + ic(K[x.kind].i, 30) + '</div>') + '<div class="bd2"><div class="t">' + esc(x.title || 'শিরোনাম নেই') + '</div><div class="meta">' + kChip(x.kind) + '</div></div></button>').join('') + '</div>' : '<div class="empty-state"><b>এই ধরনের স্টক নেই</b>অন্য ধরন দেখুন, বা নতুন কার্ড স্টকে তুলুন।</div>'; };
  m.innerHTML = '<div class="mh"><h2>' + dLong(ymd) + ', ' + hourBn(h) + '</h2><p>এই সময়ে কোন কার্ড যাবে? এখানে সাধারণত ' + K[kind].n + ' যায়।</p><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><div class="seg" id="pkt">' + [['all', 'সব'], ['text', 'টেক্সট'], ['card', 'কার্ড'], ['reel', 'রিল'], ['series', 'সিরিজ']].map(([k, l]) => '<button type="button" data-pk="' + k + '" class="' + (pk === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div><input class="inp" id="pkq" style="flex:1;min-width:140px;height:36px" placeholder="খুঁজুন"></div></div><div class="mb" id="pkg"></div><div class="mf"><button class="btn" id="pkx" type="button">বন্ধ</button></div>';
  $('back').classList.add('on'); draw();
  $('pkx').onclick = closeModal; $('pkq').oninput = (e) => { q = e.target.value.trim().toLowerCase(); draw(); };
  $('pkt').onclick = (e) => { const b = e.target.closest('[data-pk]'); if (!b) return; pk = b.dataset.pk; [...$('pkt').children].forEach((c) => c.classList.toggle('on', c === b)); draw(); };
  $('pkg').onclick = async (e) => { const b = e.target.closest('[data-use]'); if (!b) return; closeModal(); await act(() => api('schedule', { id: b.dataset.use, scheduled_at: slotISO(ymd, h) }), 'সময় ঠিক হয়েছে'); };
}

// ---------- drag and drop (week / day) ----------
function bindDnD() {
  document.querySelectorAll('[data-drag][draggable=true]').forEach((el) => {
    el.ondragstart = (e) => { DRAG = el.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', DRAG); } catch (_) {} };
    el.ondragend = () => { DRAG = null; document.querySelectorAll('.drop').forEach((c) => c.classList.remove('drop')); };
  });
  document.querySelectorAll('[data-cell]').forEach((c) => {
    const ok = () => DRAG && new Date(slotISO(c.dataset.ymd, +c.dataset.h)) > Date.now() + 2 * 60000;
    c.ondragover = (e) => { if (ok()) { e.preventDefault(); c.classList.add('drop'); } };
    c.ondragleave = () => c.classList.remove('drop');
    c.ondrop = async (e) => {
      e.preventDefault(); c.classList.remove('drop'); const id = DRAG, valid = ok(); DRAG = null; if (!id || !valid) return;
      const x = byId(id), other = DATA.items.find((y) => y.p && y.id !== id && y.status === 'queued' && y.p.ymd === c.dataset.ymd && y.p.h === +c.dataset.h);
      if (x && x.p && x.p.ymd === c.dataset.ymd && x.p.h === +c.dataset.h) return;
      if (other) await act(() => api('swap', { a: id, b: other.id }), 'দুটো পোস্টের সময় বদলাবদলি হয়েছে'); else await act(() => api('schedule', { id, scheduled_at: slotISO(c.dataset.ymd, +c.dataset.h) }), 'সময় বদলানো হয়েছে');
    };
  });
}

// ---------- events ----------
document.addEventListener('click', async (e) => {
  const t = (s) => e.target.closest(s);
  if (e.target.id === 'back') { closeModal(); closeDrawer(); return; }
  let el;
  if ((el = t('[data-check]'))) { e.stopPropagation(); const id = el.dataset.check; LIB.sel.has(id) ? LIB.sel.delete(id) : LIB.sel.add(id); render(); return; }
  if ((el = t('[data-nav]'))) { VIEW = el.dataset.nav; render(); scrollTo(0, 0); return; }
  if ((el = t('[data-pick]'))) { openPicker(el.dataset.ymd, +el.dataset.h); return; }
  if ((el = t('[data-open]'))) { if (LIB.selmode && VIEW === 'library') { const id = el.dataset.open; LIB.sel.has(id) ? LIB.sel.delete(id) : LIB.sel.add(id); render(); } else openDrawer(el.dataset.open); return; }
  if ((el = t('[data-mode]'))) { CAL.mode = el.dataset.mode; render(); return; }
  if ((el = t('[data-day]'))) { CAL.ymd = el.dataset.day; CAL.mode = 'day'; render(); return; }
  if ((el = t('[data-step]'))) { CAL.ymd = ymdAdd(CAL.ymd, +el.dataset.step); render(); return; }
  if (t('[data-today]')) { CAL.ymd = parts(new Date()).ymd; render(); return; }
  if ((el = t('[data-lk]'))) { LIB.kind = el.dataset.lk; render(); return; }
  if (t('[data-selmode]')) { LIB.selmode = !LIB.selmode; if (!LIB.selmode) LIB.sel.clear(); render(); return; }
  if ((el = t('[data-bulk]'))) {
    const ids = [...LIB.sel], a = el.dataset.bulk;
    if (a === 'clear') { LIB.sel.clear(); render(); } else if (a === 'top') { if (await act(() => api('top', { ids }), 'সবার আগে নেওয়া হয়েছে')) { LIB.sel.clear(); render(); } }
    else if (a === 'del' && await ask(bn(ids.length) + 'টা কার্ড মুছবেন?', 'আর ফেরত পাওয়া যাবে না।', 'মুছুন', true)) { if (await act(() => api('delete', { ids }), 'মুছে ফেলা হয়েছে')) { LIB.sel.clear(); render(); } }
    return;
  }
  if ((el = t('[data-retry]'))) { await act(() => api('schedule', { id: el.dataset.retry, scheduled_at: new Date(Date.now() + 3 * 60000).toISOString() }), 'আবার চেষ্টার জন্য লাইনে দেওয়া হয়েছে'); return; }
  if ((el = t('[data-tostock]'))) { await act(() => api('unschedule', { ids: [el.dataset.tostock] }), 'স্টকে ফেরানো হয়েছে'); return; }
  if ((el = t('[data-del]'))) { if (await ask('মুছে ফেলবেন?', 'এই কার্ড আর ফেরত পাওয়া যাবে না।', 'মুছুন', true)) await act(() => api('delete', { ids: [el.dataset.del] }), 'মুছে ফেলা হয়েছে'); return; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeDrawer(); } if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sc') && e.target.dataset.open) { e.preventDefault(); openDrawer(e.target.dataset.open); } });
$('q').oninput = (e) => { Q = e.target.value.trim().toLowerCase(); if (DATA.items.length) render(); };
$('rf').onclick = refresh; $('sIc').innerHTML = ic('search', 17); $('rf').innerHTML = ic('refresh', 17);
$('lo').innerHTML = ic('out') + '<span>বের হোন</span>'; $('lo2').innerHTML = ic('out'); $('lo').onclick = $('lo2').onclick = () => signOut('');
const flip = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(THEME_KEY, t); } catch (_) {} applyTheme(t); };
$('thm').onclick = $('thm2').onclick = flip; applyTheme(document.documentElement.dataset.theme);
$('gf').onsubmit = (e) => { e.preventDefault(); const c = $('gc').value.trim(); if (c) boot(c); };
addEventListener('resize', () => { if (!$('app').classList.contains('hide') && DATA.items.length) render(); });

async function boot(code) {
  CODE = code; $('ge').textContent = '';
  $('view').innerHTML = '<div class="kpis">' + '<div class="skel" style="height:104px"></div>'.repeat(4) + '</div><div class="skel" style="height:260px"></div>'; $('gate').classList.add('hide'); $('app').classList.remove('hide');
  try { await load(); } catch (e) { if (!e.handled) { $('app').classList.add('hide'); $('gate').classList.remove('hide'); $('ge').textContent = 'সংযোগ হয়নি: ' + e.message; } return false; }
  try { localStorage.setItem('pcc', code); } catch (_) {}
  render(); clearInterval(timer); timer = setInterval(() => { if (!document.hidden && !$('drawer').classList.contains('on') && !$('modal').classList.contains('on')) refresh(); }, 30000); return true;
}
async function refresh() { try { await load(); render(); } catch (e) { if (!e.handled) { $('live').classList.add('off'); $('live').innerHTML = '<i></i><span>সংযোগ নেই</span>'; } } }
function signOut(msg) { try { localStorage.removeItem('pcc'); } catch (_) {} clearInterval(timer); closeDrawer(); closeModal(); $('app').classList.add('hide'); $('gate').classList.remove('hide'); $('gc').value = ''; $('ge').textContent = msg || ''; DATA = { items: [] }; }
window.contentBoot = boot;
try { const c = localStorage.getItem('pcc'); if (c) boot(c); } catch (_) {}
</script>
</body>
</html>
